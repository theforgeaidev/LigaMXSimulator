<!DOCTYPE html>
<html lang="es" style="margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0d12;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liga MX — Centro de Partidos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap');

        body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0a0d12; touch-action: none; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }

        div.preload { font-family: 'Inter', 'Barlow Condensed'; position: absolute; left: -9999px; visibility: hidden; }

        /* Real numeric input overlay used to edit scores/penalties */
        #scoreInput {
            position: absolute;
            display: none;
            background: #12161e;
            border: 1px solid #3a4453;
            color: #f2f4f7;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            outline: none;
            border-radius: 4px;
            box-sizing: border-box;
            caret-color: #d7b56d;
        }
        #scoreInput:focus {
            border-color: #d7b56d;
        }
        /* remove native number spinners */
        #scoreInput::-webkit-outer-spin-button,
        #scoreInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        #scoreInput[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>
    <div class="preload">Preload <b style="font-weight:500">reg</b> <b style="font-weight:600">sb</b> <b style="font-weight:700">bold</b> <b style="font-weight:800">xb</b></div>
    <canvas id="appCanvas"></canvas>
    <input id="scoreInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" />

    <script type="module">
        import { ligaMX } from './Players.js';

        // Vincula cada equipo con su carpeta de plantilla y su escudo real
        const TEAM_LINKS = {
            'América': { key: 'clubAmerica', icon: 'ClubAmerica.png' },
            'Chivas': { key: 'chivas', icon: 'Chivas.png' },
            'Cruz Azul': { key: 'cruzAzul', icon: 'CruzAzul.png' },
            'Pumas': { key: 'pumas', icon: 'Pumas.png' },
            'Tigres': { key: 'tigres', icon: 'Tigres.png' },
            'Monterrey': { key: 'monterrey', icon: 'Monterrey.png' },
            'Toluca': { key: 'toluca', icon: 'Toluca.png' },
            'Pachuca': { key: 'pachuca', icon: 'Pachuca.png' },
            'León': { key: 'leon', icon: 'Leon.png' },
            'Santos': { key: 'santosLaguna', icon: 'SantosLaguna.png' },
            'Tijuana': { key: 'tijuana', icon: 'Tijuana.png' },
            'Atlas': { key: 'atlas', icon: 'Atlas.png' },
            'Puebla': { key: 'puebla', icon: 'Puebla.png' },
            'Querétaro': { key: 'queretaro', icon: 'Queretaro.png' },
            'Necaxa': { key: 'necaxa', icon: 'Necaxa.png' },
            'FC Juárez': { key: 'fcJuarez', icon: 'Juarez.png' },
            'San Luis': { key: 'atleticoSanLuis', icon: 'Sanluis.png' }
            // Mazatlán no tiene plantilla/escudo cargados en Players.js
        };
        const ICON_DIR = './LigaMXTeamIcons/';

        const TEAMS = [
            { id: 1, name: 'América', short: 'AME', c1: '#F5E97D', c2: '#0F2148' },
            { id: 2, name: 'Chivas', short: 'GUA', c1: '#E62129', c2: '#002E63' },
            { id: 3, name: 'Cruz Azul', short: 'CAZ', c1: '#003295', c2: '#C4161C' },
            { id: 4, name: 'Pumas', short: 'PUM', c1: '#B3985D', c2: '#0B2343' },
            { id: 5, name: 'Tigres', short: 'TIG', c1: '#FDB913', c2: '#005CE6' },
            { id: 6, name: 'Monterrey', short: 'MTY', c1: '#002453', c2: '#808080' },
            { id: 7, name: 'Toluca', short: 'TOL', c1: '#E30613', c2: '#000000' },
            { id: 8, name: 'Pachuca', short: 'PAC', c1: '#003366', c2: '#808080' },
            { id: 9, name: 'León', short: 'LEO', c1: '#006A42', c2: '#808080' },
            { id: 10, name: 'Santos', short: 'SAN', c1: '#00693C', c2: '#808080' },
            { id: 11, name: 'Tijuana', short: 'TIJ', c1: '#DA291C', c2: '#000000' },
            { id: 12, name: 'Atlas', short: 'ATL', c1: '#CC0000', c2: '#000000' },
            { id: 13, name: 'Puebla', short: 'PUE', c1: '#003876', c2: '#808080' },
            { id: 14, name: 'Querétaro', short: 'QRO', c1: '#000000', c2: '#005CE6' },
            { id: 15, name: 'Necaxa', short: 'NEC', c1: '#E30613', c2: '#808080' },
            { id: 16, name: 'Mazatlán', short: 'MAZ', c1: '#67216A', c2: '#000000' },
            { id: 17, name: 'FC Juárez', short: 'JUA', c1: '#009B3A', c2: '#000000' },
            { id: 18, name: 'San Luis', short: 'ASL', c1: '#E30613', c2: '#002A54' }
        ];

        let tournamentData = [];
        let teamStats = [];
        const TOTAL_ROUNDS = 17;
        let liguilla = { cuartos: [], semis: [], final: null };
        let awards = { scorers: [], assists: [], keepers: [], xi: null };

        function loadTeamAssets() {
            TEAMS.forEach(t => {
                let link = TEAM_LINKS[t.name];
                if (!link) return;
                t.rosterKey = link.key;
                let img = new Image();
                img.src = ICON_DIR + link.icon;
                t.logoImg = img;
            });
        }

        // Devuelve el primer jugador disponible de una categoría, priorizando
        // coincidencia de posición y evitando repetir el mismo jugador dos veces.
        function pickPlayer(team, category, posHint, usedKeys) {
            if (!team.rosterKey || !ligaMX[team.rosterKey]) return null;
            let arr = ligaMX[team.rosterKey][category];
            if (!arr || arr.length === 0) return null;
            let candidate = null;
            if (posHint) candidate = arr.find(p => p.pos === posHint && !usedKeys.has(team.short + '_' + p.name));
            if (!candidate) candidate = arr.find(p => !usedKeys.has(team.short + '_' + p.name));
            if (candidate) usedKeys.add(team.short + '_' + candidate.name);
            return candidate;
        }

        let appState = 'intro';
        let currentTab = 'jornada';
        let currentRound = 1;

        const canvas = document.getElementById('appCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const scoreInputEl = document.getElementById('scoreInput');
        let vw = window.innerWidth;
        let vh = window.innerHeight;
        let scrollY = 0;
        let maxScrollY = 0;
        let scrollX = 0;
        let maxScrollX = 0;

        let hitboxes = [];
        let hoveredId = null;
        let globalTime = 0;

        // Sobrio: paleta profesional, bajo contraste de acentos, sin glow ni exceso de radios
        const THEME = {
            bgDark: '#0a0d12',
            bgLight: '#0e1219',
            card: '#131720',
            cardHover: '#171c26',
            border: '#232a35',
            borderHover: '#3a4453',
            text: '#eef1f5',
            textMuted: '#7a8494',
            accent: '#c9a962',      // dorado apagado, tono "trofeo" — no neón
            accentSoft: 'rgba(201, 169, 98, 0.12)',
            red: '#b8463c',
            pitch: '#12351f',
            font: "'Inter', sans-serif",
            fontDisplay: "'Barlow Condensed', sans-serif"
        };

        function drawRect(x, y, w, h, color, r = 0) {
            ctx.fillStyle = color;
            ctx.beginPath();
            if (r > 0 && ctx.roundRect) ctx.roundRect(x, y, w, h, r);
            else ctx.rect(x, y, w, h);
            ctx.fill();
        }

        function strokeRect(x, y, w, h, color, lw = 1, r = 0) {
            ctx.strokeStyle = color;
            ctx.lineWidth = lw;
            ctx.beginPath();
            if (r > 0 && ctx.roundRect) ctx.roundRect(x, y, w, h, r);
            else ctx.rect(x, y, w, h);
            ctx.stroke();
        }

        function drawText(text, x, y, color, size, align = 'left', weight = '500', font = THEME.font) {
            ctx.fillStyle = color;
            ctx.font = `${weight} ${size}px ${font}`;
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y);
        }

        function drawBadge(team, x, y, r) {
            if (!team) {
                drawRect(x - r, y - r, r * 2, r * 2, '#2a2f38', 3);
                return;
            }
            if (team.logoImg && team.logoImg.complete && team.logoImg.naturalWidth > 0) {
                let img = team.logoImg;
                ctx.save();
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(x - r, y - r, r * 2, r * 2, 4);
                else ctx.rect(x - r, y - r, r * 2, r * 2);
                ctx.clip();
                // Fondo claro neutro para que escudos con transparencia/blanco se lean bien sobre tema oscuro
                drawRect(x - r, y - r, r * 2, r * 2, '#f4f5f7', 0);
                // Ajuste sin deformar: se calcula el tamaño real conservando su proporción (contain)
                let pad = r * 2 * 0.14;
                let boxW = r * 2 - pad, boxH = r * 2 - pad;
                let scale = Math.min(boxW / img.naturalWidth, boxH / img.naturalHeight);
                let dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
                let dx = x - dw / 2, dy = y - dh / 2;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, dx, dy, dw, dh);
                ctx.restore();
                strokeRect(x - r, y - r, r * 2, r * 2, 'rgba(255,255,255,0.14)', 1, 4);
                return;
            }
            let grd = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
            grd.addColorStop(0, team.c1);
            grd.addColorStop(1, team.c2);
            ctx.fillStyle = grd;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x - r, y - r, r * 2, r * 2, 3);
            else ctx.rect(x - r, y - r, r * 2, r * 2);
            ctx.fill();
            strokeRect(x - r, y - r, r * 2, r * 2, 'rgba(255,255,255,0.12)', 1, 3);
            drawText(team.name.charAt(0), x, y + 1, '#fff', r * 1.05, 'center', '700', THEME.fontDisplay);
        }

        function generateSchedule() {
            let pool = TEAMS.map(t => t.id);
            let numTeams = pool.length;
            for (let round = 0; round < TOTAL_ROUNDS; round++) {
                let matches = [];
                for (let i = 0; i < numTeams / 2; i++) {
                    let home = pool[i];
                    let away = pool[numTeams - 1 - i];
                    matches.push({ home: home, away: away, hScore: '', aScore: '' });
                }
                tournamentData.push(matches);
                pool.splice(1, 0, pool.pop());
            }
        }

        function calculateStats() {
            teamStats = TEAMS.map(t => ({ ...t, pts: 0, pld: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0 }));
            tournamentData.forEach(round => {
                round.forEach(m => {
                    if (m.hScore !== '' && m.aScore !== '') {
                        let h = teamStats.find(t => t.id === m.home);
                        let a = teamStats.find(t => t.id === m.away);
                        let hG = parseInt(m.hScore), aG = parseInt(m.aScore);
                        h.pld++; a.pld++; h.gf += hG; h.ga += aG; a.gf += aG; a.ga += hG;
                        if (hG > aG) { h.pts += 3; h.w++; a.l++; }
                        else if (hG < aG) { a.pts += 3; a.w++; h.l++; }
                        else { h.pts += 1; a.pts += 1; h.d++; a.d++; }
                    }
                });
            });
            teamStats.forEach(t => t.gd = t.gf - t.ga);
            teamStats.sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : b.gd !== a.gd ? b.gd - a.gd : b.gf !== a.gf ? b.gf - a.gf : a.name.localeCompare(b.name));
            teamStats.forEach((t, i) => t.rank = i + 1);
            computeAwards();
        }

        // --- Premios / Once Ideal (con nombres reales de Players.js) ---------------
        const XI_SLOTS = [
            { label: 'Lateral Derecho', cat: 'Defensores', pos: 'LD' },
            { label: 'Central', cat: 'Defensores', pos: 'DC' },
            { label: 'Central', cat: 'Defensores', pos: 'DC' },
            { label: 'Lateral Izquierdo', cat: 'Defensores', pos: 'LI' },
            { label: 'Mediocampista de Contención', cat: 'Mediocampistas', pos: 'MCD' },
            { label: 'Mediocampista', cat: 'Mediocampistas', pos: 'MC' },
            { label: 'Mediocampista Ofensivo', cat: 'Mediocampistas', pos: 'MCO' },
            { label: 'Extremo Derecho', cat: 'Delanteros', pos: 'ED' },
            { label: 'Delantero Centro', cat: 'Delanteros', pos: 'DC' },
            { label: 'Extremo Izquierdo', cat: 'Delanteros', pos: 'EI' }
        ];

        function computeAwards() {
            let played = teamStats.filter(t => t.pld > 0 && t.rosterKey);
            if (played.length === 0) { awards = { scorers: [], assists: [], keepers: [], xi: null }; return; }
            let usedKeys = new Set();

            // Goleo: el delantero titular de cada equipo recibe los goles del equipo
            let scorers = played.map(t => {
                let p = pickPlayer(t, 'Delanteros', 'DC', usedKeys);
                return { player: p ? p.name : 'Delantero', role: p && p.pos ? p.pos : 'DC', team: t, g: Math.ceil(t.gf * 0.55) };
            }).filter(s => s.g > 0).sort((a, b) => b.g - a.g);

            // Asistencias: el mediocampista ofensivo titular
            let assists = played.map(t => {
                let p = pickPlayer(t, 'Mediocampistas', 'MCO', usedKeys);
                return { player: p ? p.name : 'Mediocampista', role: p && p.pos ? p.pos : 'MCO', team: t, a: Math.floor(t.gf * 0.35) };
            }).filter(x => x.a > 0).sort((a, b) => b.a - a.a);

            // Vallas menos vencidas: el portero titular de cada equipo
            let keepers = played.map(t => {
                let p = pickPlayer(t, 'Arqueros', null, new Set()); // el portero titular puede repetirse en su propio equipo
                return { player: p ? p.name : 'Portero', team: t, ga: t.ga, pld: t.pld };
            }).sort((a, b) => (a.ga / a.pld) - (b.ga / b.pld));

            // Once ideal: equipos mejor ubicados aportan un jugador real por posición
            let pool = [...played].sort((a, b) => (b.pts + b.gd) - (a.pts + a.gd));
            let xiUsed = new Set();
            let idx = 0;
            function nextFor(cat, pos) {
                for (let tries = 0; tries < pool.length; tries++) {
                    let team = pool[idx % pool.length];
                    idx++;
                    let p = pickPlayer(team, cat, pos, xiUsed);
                    if (p) return { role: pos, label: pos, team, player: p.name, dorsal: p.dorsal };
                }
                return null;
            }
            let gkTeam = pool[0];
            let gkPlayer = pickPlayer(gkTeam, 'Arqueros', null, xiUsed);
            let xi = {
                gk: { label: 'Portero', team: gkTeam, player: gkPlayer ? gkPlayer.name : 'Portero', dorsal: gkPlayer ? gkPlayer.dorsal : null },
                def: [], mid: [], fwd: []
            };
            XI_SLOTS.forEach(slot => {
                let pick = nextFor(slot.cat, slot.pos);
                if (!pick) return;
                pick.label = slot.label;
                if (slot.cat === 'Defensores') xi.def.push(pick);
                else if (slot.cat === 'Mediocampistas') xi.mid.push(pick);
                else xi.fwd.push(pick);
            });

            awards = { scorers, assists, keepers, xi };
        }

        function calculateWinner(match, isFinal) {
            if (!match || match.ida1 === '' || match.ida2 === '' || match.vue1 === '' || match.vue2 === '') return null;
            let a1 = parseInt(match.ida1) + parseInt(match.vue1);
            let a2 = parseInt(match.ida2) + parseInt(match.vue2);
            if (a1 > a2) return match.t1;
            if (a2 > a1) return match.t2;
            if (!isFinal) return match.t1.rank < match.t2.rank ? match.t1 : match.t2;
            if (match.pen1 !== '' && match.pen2 !== '' && match.pen1 !== match.pen2) return parseInt(match.pen1) > parseInt(match.pen2) ? match.t1 : match.t2;
            return 'PENALTIES';
        }

        function checkLiguillaProgress() {
            let qW = liguilla.cuartos.map(m => m.winner);
            if (qW.every(w => w !== null && w !== 'PENALTIES')) {
                qW.sort((a, b) => a.rank - b.rank);
                if (liguilla.semis.length === 0 || liguilla.semis[0].t1.id !== qW[0].id) {
                    liguilla.semis = [
                        { id: 's1', t1: qW[0], t2: qW[3], ida1: '', ida2: '', vue1: '', vue2: '', winner: null },
                        { id: 's2', t1: qW[1], t2: qW[2], ida1: '', ida2: '', vue1: '', vue2: '', winner: null }
                    ];
                    liguilla.final = null;
                }
            } else { liguilla.semis = []; liguilla.final = null; }

            if (liguilla.semis.length === 2) {
                let sW = liguilla.semis.map(m => m.winner);
                if (sW.every(w => w !== null && w !== 'PENALTIES')) {
                    if (!liguilla.final || liguilla.final.t1.id !== sW[0].id) {
                        liguilla.final = { id: 'f1', t1: sW[0], t2: sW[1], ida1: '', ida2: '', vue1: '', vue2: '', pen1: '', pen2: '', winner: null };
                    }
                } else { liguilla.final = null; }
            }
        }

        function renderIntro() {
            drawRect(0, 0, vw, vh, THEME.bgDark);

            // línea horizontal sutil de fondo, referencia a una hoja de datos / tabla
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 1;
            for (let ly = 0; ly < vh; ly += 42) {
                ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(vw, ly); ctx.stroke();
            }

            let titleY = vh / 2 - 50;
            drawText("LIGA MX", vw / 2, titleY, THEME.text, vw < 500 ? 46 : 68, 'center', '700', THEME.fontDisplay);
            drawText("CENTRO DE PARTIDOS", vw / 2, titleY + (vw < 500 ? 34 : 46), THEME.accent, vw < 500 ? 13 : 15, 'center', '600');
            strokeRect(vw / 2 - 30, titleY + (vw < 500 ? 50 : 64), 60, 1, THEME.border, 1);
            drawText("Simulador de jornadas, tabla general y liguilla", vw / 2, titleY + (vw < 500 ? 78 : 96), THEME.textMuted, 12, 'center', '400');

            let btnW = 200, btnH = 50;
            let btnX = vw / 2 - btnW / 2;
            let btnY = vh / 2 + 110;
            let isHover = hoveredId === 'start_app';

            drawRect(btnX, btnY, btnW, btnH, isHover ? '#dab873' : THEME.accent, 3);
            drawText("COMENZAR", vw / 2, btnY + btnH / 2, '#0a0d12', 14, 'center', '700');

            addHitbox(btnX, btnY, btnW, btnH, 'start_app', () => { appState = 'app'; });
        }

        function renderHeader() {
            let h = 84;
            if (vw < 600) h = 122;

            drawRect(0, 0, vw, h, THEME.bgLight);
            strokeRect(0, h - 1, vw, 1, THEME.border);

            drawText("LIGA MX", 24, 30, THEME.text, 20, 'left', '700', THEME.fontDisplay);
            drawText("CENTRO DE PARTIDOS", 24, 52, THEME.textMuted, 10, 'left', '600');

            let tabs = [
                { id: 'jornada', label: 'JORNADA' },
                { id: 'tabla', label: 'TABLA' },
                { id: 'liguilla', label: 'LIGUILLA' },
                { id: 'plantel', label: 'PREMIOS' }
            ];

            let tabY = vw < 600 ? 70 : 22;
            let tabX = vw < 600 ? 15 : Math.max(vw - 480, 260);
            let tabContainerW = Math.min(vw - tabX - 15, 460);

            drawRect(tabX, tabY, tabContainerW, 40, THEME.card, 4);
            strokeRect(tabX, tabY, tabContainerW, 40, THEME.border, 1, 4);

            let tabW = tabContainerW / tabs.length;
            tabs.forEach((tab, i) => {
                let tx = tabX + (i * tabW);
                let isActive = currentTab === tab.id;
                let isHover = hoveredId === `tab_${tab.id}`;

                if (isActive) {
                    drawRect(tx + 3, tabY + 3, tabW - 6, 34, THEME.accentSoft, 3);
                    strokeRect(tx + 3, tabY + 3, tabW - 6, 34, THEME.accent, 1, 3);
                } else if (isHover) {
                    drawRect(tx + 3, tabY + 3, tabW - 6, 34, THEME.cardHover, 3);
                }

                drawText(tab.label, tx + (tabW / 2), tabY + 20, isActive ? THEME.accent : (isHover ? THEME.text : THEME.textMuted), 11, 'center', '700');

                addHitbox(tx, tabY, tabW, 40, `tab_${tab.id}`, () => {
                    currentTab = tab.id;
                    scrollY = 0; scrollX = 0;
                    if (currentTab === 'liguilla' && liguilla.cuartos.length === 0) generateLiguilla();
                });
            });

            return h;
        }

        function renderJornada(startY) {
            let contentH = 0;
            let padX = vw < 600 ? 10 : 20;
            let contentW = vw - (padX * 2);
            let y = startY + scrollY + 25;

            let roundBtnW = 42;
            for (let i = 1; i <= TOTAL_ROUNDS; i++) {
                let bx = padX + scrollX + ((i - 1) * (roundBtnW + 8));
                let isActive = currentRound === i;
                let isHover = hoveredId === `rnd_${i}`;

                if (isActive) {
                    drawRect(bx, y, roundBtnW, 38, THEME.accent, 3);
                } else {
                    drawRect(bx, y, roundBtnW, 38, isHover ? THEME.cardHover : THEME.card, 3);
                    strokeRect(bx, y, roundBtnW, 38, isHover ? THEME.borderHover : THEME.border, 1, 3);
                }
                drawText(`J${i}`, bx + roundBtnW / 2, y + 19, isActive ? '#0a0d12' : THEME.textMuted, 12, 'center', '700');

                if (bx > -roundBtnW && bx < vw) {
                    addHitbox(bx, y, roundBtnW, 38, `rnd_${i}`, () => { currentRound = i; });
                }
            }

            let roundsTotalW = TOTAL_ROUNDS * (roundBtnW + 8);
            maxScrollX = roundsTotalW > vw ? roundsTotalW - vw + 40 : 0;
            if (maxScrollX === 0) scrollX = 0;

            y += 58;

            drawRect(padX, y, contentW, 54, THEME.card, 4);
            strokeRect(padX, y, contentW, 54, THEME.border, 1, 4);
            drawText(`JORNADA ${String(currentRound).padStart(2, '0')}`, padX + 22, y + 27, THEME.text, 17, 'left', '700');

            let btnX = padX + contentW - 96;
            let isHoverClear = hoveredId === 'clear_rnd';
            drawRect(btnX, y + 13, 76, 28, isHoverClear ? 'rgba(184,70,60,0.18)' : 'rgba(184,70,60,0.08)', 3);

        function drawMatchupCard(m, x, y, w, phase) {
            let h = 96;
            drawRect(x, y, w, h, THEME.card, 4);
            strokeRect(x, y, w, h, THEME.border, 1, 4);

            if (!m) return h;
            let isFinal = phase === 'final';
            let allFilled = m.ida1 !== '' && m.ida2 !== '' && m.vue1 !== '' && m.vue2 !== '';
            let aggTied = allFilled && (parseInt(m.ida1 || 0) + parseInt(m.vue1 || 0) === parseInt(m.ida2 || 0) + parseInt(m.vue2 || 0));

            let yOff = y;
            [m.t1, m.t2].forEach((team, i) => {
                let isWinner = m.winner === team;
                let bg = isWinner ? THEME.cardHover : 'transparent';
                drawRect(x, yOff, w, 48, bg, 0);
                if (isWinner) drawRect(x, yOff + 10, 3, 28, THEME.accent, 0);
                if (i === 0) strokeRect(x, yOff + 48, w, 1, THEME.border);

                if (team) {
                    drawText(team.rank, x + 20, yOff + 24, THEME.textMuted, 10, 'center', '600');
                    drawBadge(team, x + 45, yOff + 24, 11);
                    drawText(team.name.toUpperCase(), x + 65, yOff + 24, isWinner ? THEME.text : THEME.textMuted, 12, 'left', '600');

                    if (aggTied && isWinner && !isFinal) {
                        drawText("MEJOR TABLA", x + w - 150, yOff + 24, THEME.textMuted, 9, 'right', '700');
                    }
                }

                let inW = 30, inH = 28;
                let fieldIda = i === 0 ? 'ida1' : 'ida2';
                let fieldVue = i === 0 ? 'vue1' : 'vue2';

                let valIda = m[fieldIda] !== '' ? m[fieldIda] : '–';
                let hoverIda = hoveredId === `lig_${phase}_${m.id}_${fieldIda}`;
                drawRect(x + w - 84, yOff + (48 - inH) / 2, inW, inH, hoverIda ? THEME.cardHover : THEME.bgDark, 3);
                strokeRect(x + w - 84, yOff + (48 - inH) / 2, inW, inH, valIda !== '–' ? THEME.accent : THEME.border, valIda !== '–' ? 1.5 : 1, 3);
                drawText(valIda, x + w - 69, yOff + 24, valIda !== '–' ? THEME.text : THEME.textMuted, 13, 'center', '700');
                addHitbox(x + w - 84, yOff + (48 - inH) / 2, inW, inH, `lig_${phase}_${m.id}_${fieldIda}`, (box) => {
                    openScoreInput(box, m, fieldIda, () => { m.winner = calculateWinner(m, isFinal); checkLiguillaProgress(); });
                });

                let valVue = m[fieldVue] !== '' ? m[fieldVue] : '–';
                let hoverVue = hoveredId === `lig_${phase}_${m.id}_${fieldVue}`;
                drawRect(x + w - 44, yOff + (48 - inH) / 2, inW, inH, hoverVue ? THEME.cardHover : THEME.bgDark, 3);
                strokeRect(x + w - 44, yOff + (48 - inH) / 2, inW, inH, valVue !== '–' ? THEME.accent : THEME.border, valVue !== '–' ? 1.5 : 1, 3);
                drawText(valVue, x + w - 29, yOff + 24, valVue !== '–' ? THEME.text : THEME.textMuted, 13, 'center', '700');
                addHitbox(x + w - 44, yOff + (48 - inH) / 2, inW, inH, `lig_${phase}_${m.id}_${fieldVue}`, (box) => {
                    openScoreInput(box, m, fieldVue, () => { m.winner = calculateWinner(m, isFinal); checkLiguillaProgress(); });
                });

                yOff += 48;
            });

            if (isFinal && aggTied) {
                h += 64;
                strokeRect(x, y + 96, w, 64, THEME.border);
                drawText("TANDA DE PENALES", x + w / 2, y + 114, THEME.accent, 10, 'center', '700');

                let inW = 34, inH = 34;

                drawRect(x + w / 2 - 52, y + 122, inW, inH, hP1 ? THEME.cardHover : THEME.card, 3); strokeRect(x + w / 2 - 52, y + 122, inW, inH, THEME.border, 1, 3);
                drawText(m.pen1 !== '' ? m.pen1 : '–', x + w / 2 - 35, y + 139, m.pen1 !== '' ? THEME.text : THEME.textMuted, 14, 'center', '700');
                addHitbox(x + w / 2 - 52, y + 122, inW, inH, `lig_pen1`, (box) => { openScoreInput(box, m, 'pen1', () => { m.winner = calculateWinner(m, isFinal); checkLiguillaProgress(); }); });

                drawText("VS", x + w / 2, y + 139, THEME.textMuted, 12, 'center', '600');

                let hP2 = hoveredId === 'lig_pen2';
                drawRect(x + w / 2 + 18, y + 122, inW, inH, hP2 ? THEME.cardHover : THEME.card, 3); strokeRect(x + w / 2 + 18, y + 122, inW, inH, THEME.border, 1, 3);
                drawText(m.pen2 !== '' ? m.pen2 : '–', x + w / 2 + 35, y + 139, m.pen2 !== '' ? THEME.text : THEME.textMuted, 14, 'center', '700');
                addHitbox(x + w / 2 + 18, y + 122, inW, inH, `lig_pen2`, (box) => { openScoreInput(box, m, 'pen2', () => { m.winner = calculateWinner(m, isFinal); checkLiguillaProgress(); }); });

        function renderLiguilla(startY) {

        // --- Tab de premios / once ideal --------------------------------------------
        function awardCard(x, y, w, h, label, value, sub, team) {
            drawRect(x, y, w, h, THEME.card, 4);
            strokeRect(x, y, w, h, THEME.border, 1, 4);

        function renderPlantel(startY) {
            let padX = vw < 600 ? 10 : 20;
            let contentW = vw - (padX * 2);
            let y = startY + scrollY + 25;
            scrollX = 0; maxScrollX = 0;

            drawRect(padX, y, contentW, 54, THEME.cardHover, 4);
            strokeRect(padX, y, contentW, 54, THEME.border, 1, 4);
            drawText("PREMIOS DE LA TEMPORADA", padX + 22, y + 27, THEME.text, 16, 'left', '700');
            y += 70;

            if (!awards.xi || awards.scorers.length === 0) {
                drawRect(padX, y, contentW, 70, THEME.card, 4); strokeRect(padX, y, contentW, 70, THEME.border, 1, 4);
                drawText("Registra resultados en Jornada para calcular los premios", padX + contentW / 2, y + 35, THEME.textMuted, 12, 'center', '500');
                maxScrollY = Math.max(0, y + 90 - (startY + scrollY) - vh + 100);
                return;
            }

            // Fila de premios individuales
            let isMobile = vw < 720;
            let cardsPerRow = isMobile ? 1 : 3;
            let gap = 16;
            let cardW = (contentW - gap * (cardsPerRow - 1)) / cardsPerRow;
            let cardH = 96;

            let topScorer = awards.scorers[0];
            let topAssist = awards.assists[0];
            let topKeeper = awards.keepers[0];

            let cards = [
                { label: 'BOTA DE ORO', value: topScorer.player, sub: `${topScorer.g} goles · ${topScorer.team.name}`, team: topScorer.team },
                { label: 'MEJOR ASISTENTE', value: topAssist ? topAssist.player : '—', sub: topAssist ? `${topAssist.a} asistencias · ${topAssist.team.name}` : 'Sin datos aún', team: topAssist ? topAssist.team : null },
                { label: 'GUANTE DORADO', value: topKeeper.player, sub: `${topKeeper.ga} recibidos · ${topKeeper.team.name} (${topKeeper.pld} PJ)`, team: topKeeper.team }
            ];

            cards.forEach((c, i) => {
                let col = isMobile ? 0 : i % cardsPerRow;
                let row = isMobile ? i : 0;
                let cx = padX + col * (cardW + gap);
                let cy = y + row * (cardH + gap);
                awardCard(cx, cy, cardW, cardH, c.label, c.value, c.sub, c.team);
            });

            y += isMobile ? (cards.length * (cardH + gap)) : (cardH + gap);
            y += 10;

            // Once ideal — cancha
            drawText("ONCE IDEAL DE LA TEMPORADA", padX, y + 8, THEME.text, 16, 'left', '700');
            y += 32;

            let pitchW = Math.min(contentW, 620);
            let pitchX = padX + (contentW - pitchW) / 2;
            let pitchH = 460;

            drawRect(pitchX, y, pitchW, pitchH, THEME.pitch, 4);
            strokeRect(pitchX, y, pitchW, pitchH, THEME.border, 1, 4);

            // líneas de cancha
            ctx.strokeStyle = 'rgba(255,255,255,0.14)';
            ctx.lineWidth = 1;
            strokeRect(pitchX + 20, y + 20, pitchW - 40, pitchH - 40, 'rgba(255,255,255,0.14)', 1);
            ctx.beginPath(); ctx.moveTo(pitchX + 20, y + pitchH / 2); ctx.lineTo(pitchX + pitchW - 20, y + pitchH / 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(pitchX + pitchW / 2, y + pitchH / 2, 46, 0, Math.PI * 2); ctx.stroke();
            strokeRect(pitchX + pitchW / 2 - 70, y + 20, 140, 34, 'rgba(255,255,255,0.14)', 1);
            strokeRect(pitchX + pitchW / 2 - 70, y + pitchH - 54, 140, 34, 'rgba(255,255,255,0.14)', 1);

            const xi = awards.xi;
            let rowsY = {
                fwd: y + 62,
                mid: y + 62 + (pitchH - 124) * 0.34,
                def: y + 62 + (pitchH - 124) * 0.68,
                gk: y + pitchH - 40
            };

            function placeRow(list, rowY) {
                let n = list.length;
                list.forEach((p, i) => {
                    let px = pitchX + pitchW * ((i + 1) / (n + 1));
                    drawBadge(p.team, px, rowY, 15);
                    if (p.dorsal) drawText(String(p.dorsal), px, rowY, '#fff', 9, 'center', '700');
                    drawText(p.player, px, rowY + 26, THEME.text, 10.5, 'center', '700');
                    drawText(p.label, px, rowY + 39, THEME.textMuted, 8, 'center', '500');
                });
            }

            placeRow(xi.fwd, rowsY.fwd);
            placeRow(xi.mid, rowsY.mid);
            placeRow(xi.def, rowsY.def);
            placeRow([xi.gk], rowsY.gk);

            y += pitchH + 90;
            maxScrollY = Math.max(0, y - (startY + scrollY) - vh + 100);
        }

        // --- Edición de marcadores con input HTML real, sin teclado personalizado ---
        function openScoreInput(screenBox, obj, field, callback) {
            scoreInputEl.style.display = 'block';
            scoreInputEl.style.left = screenBox.x + 'px';
            scoreInputEl.style.top = screenBox.y + 'px';
            scoreInputEl.style.width = screenBox.w + 'px';
            scoreInputEl.style.height = screenBox.h + 'px';
            scoreInputEl.value = obj[field] !== '' ? String(obj[field]) : '';
            scoreInputEl.focus();
            scoreInputEl.select();

            const commit = () => {
                let v = scoreInputEl.value.replace(/[^0-9]/g, '');
                obj[field] = v === '' ? '' : Math.min(99, parseInt(v));
                scoreInputEl.style.display = 'none';
                scoreInputEl.oninput = null;
                scoreInputEl.onblur = null;
                scoreInputEl.onkeydown = null;
                if (callback) callback();
            };

            scoreInputEl.oninput = () => {
                scoreInputEl.value = scoreInputEl.value.replace(/[^0-9]/g, '').slice(0, 2);
            };
            scoreInputEl.onkeydown = (e) => {
                if (e.key === 'Enter') { commit(); }
                if (e.key === 'Escape') { scoreInputEl.style.display = 'none'; scoreInputEl.onblur = null; }
            };
            scoreInputEl.onblur = commit;
        }

        function generateLiguilla() {
            const top8 = teamStats.slice(0, 8);
            if (top8.length < 8) return;
            liguilla.cuartos = [
                { id: 'c1', t1: top8[0], t2: top8[7], ida1: '', ida2: '', vue1: '', vue2: '', winner: null },
                { id: 'c2', t1: top8[3], t2: top8[4], ida1: '', ida2: '', vue1: '', vue2: '', winner: null },
                { id: 'c3', t1: top8[1], t2: top8[6], ida1: '', ida2: '', vue1: '', vue2: '', winner: null },
                { id: 'c4', t1: top8[2], t2: top8[5], ida1: '', ida2: '', vue1: '', vue2: '', winner: null }
            ];
            liguilla.semis = []; liguilla.final = null;
        }

        function render(time) {
            globalTime = time / 1000;
            hitboxes = [];

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (appState === 'intro') {
                renderIntro();
            } else {
                let headerH = renderHeader();

                ctx.save();
                ctx.beginPath();
                ctx.rect(0, headerH, vw, vh - headerH);
                ctx.clip();

                if (currentTab === 'jornada') renderJornada(headerH);
                else if (currentTab === 'tabla') renderTabla(headerH);
                else if (currentTab === 'liguilla') renderLiguilla(headerH);
                else if (currentTab === 'plantel') renderPlantel(headerH);

                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        function addHitbox(x, y, w, h, id, callback) {
            hitboxes.push({ x, y, w, h, id, callback });
        }

        function findHitbox(x, y) {
            for (let i = hitboxes.length - 1; i >= 0; i--) {
                let hb = hitboxes[i];
                if (x >= hb.x && x <= hb.x + hb.w && y >= hb.y && y <= hb.y + hb.h) return hb;
            }
            return null;
        }

        canvas.addEventListener('click', (e) => {
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            let hb = findHitbox(x, y);
            if (hb) {
                hb.callback({ x: rect.left + hb.x, y: rect.top + hb.y, w: hb.w, h: hb.h });
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            let hb = findHitbox(x, y);
            let newId = hb ? hb.id : null;
            if (newId !== hoveredId) {
                hoveredId = newId;
                canvas.style.cursor = hoveredId ? 'pointer' : 'default';
            }
        });

        canvas.addEventListener('mouseleave', () => {
            hoveredId = null;
            canvas.style.cursor = 'default';
        });

        canvas.addEventListener('wheel', (e) => {
            if (appState === 'intro') return;
            if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
                scrollX -= e.deltaX;
                scrollX = Math.min(0, Math.max(scrollX, -maxScrollX));
            } else {
                scrollY -= e.deltaY;
                scrollY = Math.min(0, Math.max(scrollY, -maxScrollY));
            }
            e.preventDefault();
        }, { passive: false });

        let touchStartY = 0, touchStartX = 0;
        let initScrollY = 0, initScrollX = 0;
        canvas.addEventListener('touchstart', (e) => {
            if (appState === 'intro') return;
            touchStartY = e.touches[0].clientY;
            touchStartX = e.touches[0].clientX;
            initScrollY = scrollY;
            initScrollX = scrollX;
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (appState === 'intro') return;
            let dy = e.touches[0].clientY - touchStartY;
            let dx = e.touches[0].clientX - touchStartX;

            if (Math.abs(dx) > Math.abs(dy) * 1.5 && maxScrollX > 0) {
                scrollX = initScrollX + dx;
                scrollX = Math.min(0, Math.max(scrollX, -maxScrollX));
            } else {
                scrollY = initScrollY + dy;
                scrollY = Math.min(0, Math.max(scrollY, -maxScrollY));
            }
        }, { passive: true });

        function resize() {
            vw = window.innerWidth;
            vh = window.innerHeight;
            let dpr = window.devicePixelRatio || 1;
            canvas.width = vw * dpr;
            canvas.height = vh * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);

        window.onload = function () {
            resize();
            loadTeamAssets();
            generateSchedule();
            calculateStats();
            requestAnimationFrame(render);
        };
    </script>
</body>
</html>

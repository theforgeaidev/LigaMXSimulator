<!DOCTYPE html>
<html lang="es" style="margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0d12;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liga MX — Centro de Partidos</title>
    <link rel="icon" type="image/png" href="./LigaMXIcon/LigaMx.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap');

        body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0a0d12; touch-action: none; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }

        div.preload { font-family: 'Inter', 'Barlow Condensed'; position: absolute; left: -9999px; visibility: hidden; }

        #scoreInput {
            position: absolute;
            display: none;
            background: #12161e;
            border: 1px solid #3a4453;
            color: #f2f4f7;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            outline: none;
            border-radius: 4px;
            box-sizing: border-box;
            caret-color: #d7b56d;
        }
        #scoreInput:focus {
            border-color: #d7b56d;
        }
        #scoreInput::-webkit-outer-spin-button,
        #scoreInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        #scoreInput[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>
    <div class="preload">Preload <b style="font-weight:500">reg</b> <b style="font-weight:600">sb</b> <b style="font-weight:700">bold</b> <b style="font-weight:800">xb</b></div>
    <canvas id="appCanvas"></canvas>
    <input id="scoreInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" />

    <script type="module">
        import { ligaMX } from './Players.js';

        const TEAM_LINKS = {
            'América': { key: 'clubAmerica', icon: 'ClubAmerica.png' },
            'Chivas': { key: 'chivas', icon: 'Chivas.png', badgeScale: 1.65 },
            'Cruz Azul': { key: 'cruzAzul', icon: 'CruzAzul.png' },
            'Pumas': { key: 'pumas', icon: 'Pumas.png' },
            'Tigres': { key: 'tigres', icon: 'Tigres.png' },
            'Monterrey': { key: 'monterrey', icon: 'Monterrey.png' },
            'Toluca': { key: 'toluca', icon: 'Toluca.png' },
            'Pachuca': { key: 'pachuca', icon: 'Pachuca.png' },
            'León': { key: 'leon', icon: 'Leon.png' },
            'Santos': { key: 'santosLaguna', icon: 'SantosLaguna.png' },
            'Tijuana': { key: 'tijuana', icon: 'Tijuana.png' },
            'Atlas': { key: 'atlas', icon: 'Atlas.png' },
            'Puebla': { key: 'puebla', icon: 'Puebla.png' },
            'Querétaro': { key: 'queretaro', icon: 'Queretaro.png' },
            'Necaxa': { key: 'necaxa', icon: 'Necaxa.png' },
            'FC Juárez': { key: 'fcJuarez', icon: 'Juarez.png' },
            'San Luis': { key: 'atleticoSanLuis', icon: 'Sanluis.png' },
            'Atlante': { key: 'atlante', icon: 'Atlante.png' }
        };
        const ICON_DIR = './LigaMXTeamIcons/';

        // Logo oficial de la liga, usado en la portada y en el encabezado
        const LEAGUE_ICON_DIR = './LigaMXIcon/';
        let leagueLogoImg = new Image();
        // Si el logo se ve chico dentro de su cuadro (mucho margen transparente en el PNG),
        // sube este número (p. ej. 1.3, 1.5) para acercar el zoom, igual que con los escudos.
        const LEAGUE_LOGO_SCALE = 1.25;
        function loadLeagueLogo() { leagueLogoImg.src = LEAGUE_ICON_DIR + 'LigaMx.png'; }

        // Dibuja el logo de la liga en un cuadro de tamaño fijo, con un fondo neutro
        // detrás (igual que los escudos) para que se vea limpio sin importar si el PNG
        // tiene fondo transparente, blanco o de otro color.
        function drawLeagueLogo(x, y, size) {
            if (leagueLogoImg && leagueLogoImg.complete && leagueLogoImg.naturalWidth > 0) {
                let scale = Math.min(size / leagueLogoImg.naturalWidth, size / leagueLogoImg.naturalHeight) * LEAGUE_LOGO_SCALE;
                let dw = leagueLogoImg.naturalWidth * scale, dh = leagueLogoImg.naturalHeight * scale;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(leagueLogoImg, x - dw / 2, y - dh / 2, dw, dh);
                return true;
            }
            return false;
        }

        // Iconos de eventos del partido en vivo. Si el archivo no existe o no carga,
        // se usa automáticamente el emoji equivalente como respaldo (mismo tamaño siempre).
        const EVENT_ICON_DIR = './InGameIcons/';
        const EVENT_ICON_FILES = {
            yellow: 'YellowCard.png',
            red: 'RedCard.png',
            goal: 'Goal.png',
            sub: 'Substitution.png',
            corner: 'Corner.png',
            foul: 'Foul.png',
            save: 'Save.png',
            shot: 'Shot.png',
            chance: 'Chance.png',
            offside: 'Offside.png',
            half: 'Whistle.png',
            full: 'Whistle.png',
            kick: 'Whistle.png'
        };
        let eventIconImgs = {};
        function loadEventIcons() {
            Object.keys(EVENT_ICON_FILES).forEach(key => {
                let img = new Image();
                img.src = EVENT_ICON_DIR + EVENT_ICON_FILES[key];
                eventIconImgs[key] = img;
            });
        }

        // Dibuja el ícono de un evento del log en un cuadro de tamaño fijo `size`,
        // centrado en (x,y). Usa el PNG de InGameIcons si ya cargó; si no, cae al emoji.
        function drawEventIcon(type, x, y, size, color) {
            let img = eventIconImgs[type];
            let plateR = size / 2 + 3;
            drawRect(x - plateR, y - plateR, plateR * 2, plateR * 2, 'rgba(255,255,255,0.05)', 5);
            if (img && img.complete && img.naturalWidth > 0) {
                let scale = Math.min(size / img.naturalWidth, size / img.naturalHeight);
                let dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, x - dw / 2, y - dh / 2, dw, dh);
                return;
            }
            drawVectorIcon(type, x, y, size, color);
        }

        // Íconos vectoriales de respaldo: se dibujan con formas simples (no emoji), así
        // siempre se ven del mismo tamaño y estilo sin importar el dispositivo del usuario.
        function drawVectorIcon(type, x, y, size, color) {
            let r = size / 2;
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = Math.max(1.4, size * 0.11);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            switch (type) {
                case 'goal': {
                    ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.fill();
                    break;
                }
                case 'yellow':
                case 'red': {
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(x - r * 0.42, y - r * 0.62, r * 0.84, r * 1.24, 1.5);
                    else ctx.rect(x - r * 0.42, y - r * 0.62, r * 0.84, r * 1.24);
                    ctx.fill();
                    break;
                }
                case 'foul': {
                    ctx.beginPath();
                    ctx.moveTo(x - r * 0.35, y - r * 0.6); ctx.lineTo(x - r * 0.35, y + r * 0.6);
                    ctx.moveTo(x - r * 0.35, y - r * 0.55); ctx.lineTo(x + r * 0.4, y - r * 0.28); ctx.lineTo(x - r * 0.35, y - r * 0.05);
                    ctx.stroke();
                    break;
                }
                case 'corner': {
                    ctx.beginPath();
                    ctx.moveTo(x - r * 0.4, y - r * 0.6); ctx.lineTo(x - r * 0.4, y + r * 0.6);
                    ctx.moveTo(x - r * 0.4, y - r * 0.55); ctx.lineTo(x + r * 0.35, y - r * 0.55); ctx.lineTo(x - r * 0.05, y - r * 0.15); ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'save': {
                    ctx.beginPath();
                    ctx.moveTo(x - r * 0.55, y + r * 0.1);
                    ctx.quadraticCurveTo(x - r * 0.55, y - r * 0.6, x, y - r * 0.6);
                    ctx.quadraticCurveTo(x + r * 0.55, y - r * 0.6, x + r * 0.55, y + r * 0.1);
                    ctx.lineTo(x + r * 0.3, y + r * 0.55);
                    ctx.lineTo(x - r * 0.3, y + r * 0.55);
                    ctx.closePath();
                    ctx.stroke();
                    break;
                }
                case 'shot': {
                    ctx.beginPath();
                    ctx.moveTo(x - r * 0.5, y + r * 0.55); ctx.lineTo(x + r * 0.5, y - r * 0.55);
                    ctx.moveTo(x - r * 0.05, y - r * 0.55); ctx.lineTo(x + r * 0.5, y - r * 0.55); ctx.lineTo(x + r * 0.5, y - r * 0.05);
                    ctx.stroke();
                    break;
                }
                case 'chance': {
                    ctx.beginPath();
                    ctx.moveTo(x - r * 0.5, y); ctx.lineTo(x + r * 0.35, y);
                    ctx.moveTo(x + r * 0.1, y - r * 0.35); ctx.lineTo(x + r * 0.5, y); ctx.lineTo(x + r * 0.1, y + r * 0.35);
                    ctx.stroke();
                    break;
                }
                case 'offside': {
                    ctx.beginPath();
                    ctx.moveTo(x - r * 0.4, y + r * 0.6); ctx.lineTo(x - r * 0.4, y - r * 0.6);
                    ctx.moveTo(x - r * 0.4, y - r * 0.55); ctx.lineTo(x + r * 0.4, y - r * 0.35); ctx.lineTo(x - r * 0.4, y - r * 0.15); ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'sub': {
                    ctx.beginPath();
                    ctx.moveTo(x - r * 0.15, y - r * 0.55); ctx.lineTo(x - r * 0.15, y + r * 0.25);
                    ctx.moveTo(x - r * 0.4, y + r * 0.0); ctx.lineTo(x - r * 0.15, y + r * 0.3); ctx.lineTo(x + r * 0.1, y + r * 0.0);
                    ctx.moveTo(x + r * 0.2, y + r * 0.55); ctx.lineTo(x + r * 0.2, y - r * 0.25);
                    ctx.moveTo(x - r * 0.05, y - r * 0.0); ctx.lineTo(x + r * 0.2, y - r * 0.3); ctx.lineTo(x + r * 0.45, y - r * 0.0);
                    ctx.stroke();
                    break;
                }
                case 'half':
                case 'full':
                case 'kick':
                default: {
                    ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.stroke();
                    if (type === 'kick') { ctx.beginPath(); ctx.moveTo(x - r * 0.2, y - r * 0.28); ctx.lineTo(x - r * 0.2, y + r * 0.28); ctx.lineTo(x + r * 0.3, y); ctx.closePath(); ctx.fill(); }
                    else if (type === 'full') { ctx.fillRect(x - r * 0.22, y - r * 0.22, r * 0.44, r * 0.44); }
                    else { ctx.fillRect(x - r * 0.28, y - r * 0.22, r * 0.18, r * 0.44); ctx.fillRect(x + r * 0.1, y - r * 0.22, r * 0.18, r * 0.44); }
                    break;
                }
            }
            ctx.restore();
        }

        // Mazatlán fue sustituido por Atlante en el torneo
        const TEAMS = [
            { id: 1, name: 'América', short: 'AME', c1: '#F5E97D', c2: '#0F2148' },
            { id: 2, name: 'Chivas', short: 'GUA', c1: '#E62129', c2: '#002E63' },
            { id: 3, name: 'Cruz Azul', short: 'CAZ', c1: '#003295', c2: '#C4161C' },
            { id: 4, name: 'Pumas', short: 'PUM', c1: '#B3985D', c2: '#0B2343' },
            { id: 5, name: 'Tigres', short: 'TIG', c1: '#FDB913', c2: '#005CE6' },
            { id: 6, name: 'Monterrey', short: 'MTY', c1: '#002453', c2: '#808080' },
            { id: 7, name: 'Toluca', short: 'TOL', c1: '#E30613', c2: '#000000' },
            { id: 8, name: 'Pachuca', short: 'PAC', c1: '#003366', c2: '#808080' },
            { id: 9, name: 'León', short: 'LEO', c1: '#006A42', c2: '#808080' },
            { id: 10, name: 'Santos', short: 'SAN', c1: '#00693C', c2: '#808080' },
            { id: 11, name: 'Tijuana', short: 'TIJ', c1: '#DA291C', c2: '#000000' },
            { id: 12, name: 'Atlas', short: 'ATL', c1: '#CC0000', c2: '#000000' },
            { id: 13, name: 'Puebla', short: 'PUE', c1: '#003876', c2: '#808080' },
            { id: 14, name: 'Querétaro', short: 'QRO', c1: '#000000', c2: '#005CE6' },
            { id: 15, name: 'Necaxa', short: 'NEC', c1: '#E30613', c2: '#808080' },
            { id: 16, name: 'Atlante', short: 'ANT', c1: '#0C2C6B', c2: '#7A1230' },
            { id: 17, name: 'FC Juárez', short: 'JUA', c1: '#009B3A', c2: '#000000' },
            { id: 18, name: 'San Luis', short: 'ASL', c1: '#E30613', c2: '#002A54' }
        ];

        let tournamentData = [];
        let teamStats = [];
        const TOTAL_ROUNDS = 17;
        let liguilla = { cuartos: [], semis: [], final: null };
        let awards = { scorers: [], assists: [], keepers: [], xi: null };

        function loadTeamAssets() {
            TEAMS.forEach(t => {
                let link = TEAM_LINKS[t.name];
                if (!link) return;
                t.rosterKey = link.key;
                t.badgeScale = link.badgeScale || 1;
                let img = new Image();
                img.src = ICON_DIR + link.icon;
                t.logoImg = img;
            });
        }

        function pickPlayer(team, category, posHint, usedKeys) {
            if (!team.rosterKey || !ligaMX[team.rosterKey]) return null;
            let arr = ligaMX[team.rosterKey][category];
            if (!arr || arr.length === 0) return null;
            let available = p => !usedKeys.has(team.short + '_' + p.name);
            let candidate = null;
            // 1) titular confirmado en la posición pedida, 2) cualquier titular confirmado,
            // 3) coincidencia de posición sin confirmar, 4) cualquiera disponible
            if (posHint) candidate = arr.find(p => p.pos === posHint && p.titular === true && available(p));
            if (!candidate) candidate = arr.find(p => p.titular === true && available(p));
            if (!candidate && posHint) candidate = arr.find(p => p.pos === posHint && available(p));
            if (!candidate) candidate = arr.find(available);
            if (candidate) usedKeys.add(team.short + '_' + candidate.name);
            return candidate;
        }

        // --- Reparto realista de goles / asistencias por plantilla completa --------
        // Los goles y asistencias del equipo se reparten entre TODA la plantilla con
        // pesos por posición: delanteros anotan mucho, mediocampistas ofensivos reparten
        // y anotan algo, defensas anotan poco (balón parado), y los porteros casi nunca.
        function buildWeightedPool(team, mode) {
            if (!team.rosterKey || !ligaMX[team.rosterKey]) return [];
            let roster = ligaMX[team.rosterKey];
            let pool = [];
            (roster.Delanteros || []).forEach((p, i) => pool.push({ p, cat: 'DEL', weight: (mode === 'goals' ? 3.2 : 1.1) * playerImportance(p, i) }));
            (roster.Mediocampistas || []).forEach((p, i) => {
                let ofensivo = p.pos === 'MCO' || p.pos === 'ED' || p.pos === 'EI';
                pool.push({ p, cat: 'MED', weight: (mode === 'goals' ? (ofensivo ? 1.8 : 0.7) : (ofensivo ? 3.4 : 1.6)) * playerImportance(p, i) });
            });
            (roster.Defensores || []).forEach((p, i) => pool.push({ p, cat: 'DEF', weight: (mode === 'goals' ? 0.35 : 0.5) * playerImportance(p, i) }));
            (roster.Arqueros || []).forEach((p, i) => pool.push({ p, cat: 'POR', weight: (mode === 'goals' ? 0.015 : 0.08) * playerImportance(p, i) }));
            return pool;
        }

        // Reparte `total` unidades enteras proporcionalmente al peso (mayores restos)
        function distributeWeighted(team, total, mode) {
            let pool = buildWeightedPool(team, mode);
            if (pool.length === 0 || total <= 0) return [];
            let totalWeight = pool.reduce((s, x) => s + x.weight, 0);
            pool.forEach(x => { x.exact = total * x.weight / totalWeight; x.val = Math.floor(x.exact); });
            let assigned = pool.reduce((s, x) => s + x.val, 0);
            let remainder = total - assigned;
            let byRemainder = [...pool].sort((a, b) => (b.exact - b.val) - (a.exact - a.val));
            for (let i = 0; i < remainder && byRemainder.length > 0; i++) byRemainder[i % byRemainder.length].val++;
            return pool.filter(x => x.val > 0).map(x => ({ player: x.p.name, role: x.p.pos || x.cat, cat: x.cat, team, val: x.val }));
        }

        let appState = 'intro';
        let currentTab = 'jornada';
        let currentRound = 1;
        const TAB_ORDER = ['jornada', 'tabla', 'liguilla', 'plantel'];
        let tabAnim = null;

        function renderTabByName(tabId, startY) {
            if (tabId === 'jornada') renderJornada(startY);
            else if (tabId === 'tabla') renderTabla(startY);
            else if (tabId === 'liguilla') renderLiguilla(startY);
            else if (tabId === 'plantel') renderPlantel(startY);
        }

        const canvas = document.getElementById('appCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const scoreInputEl = document.getElementById('scoreInput');
        let vw = window.innerWidth;
        let vh = window.innerHeight;
        let scrollY = 0;
        let maxScrollY = 0;
        let scrollX = 0;
        let maxScrollX = 0;

        let hitboxes = [];
        let hoveredId = null;
        let globalTime = 0;
        let lastFrameTime = 0;

        // --- Simulador de partidos en vivo, minuto a minuto -------------------------
        let simState = null;
        let simScrollY = 0;
        let simMaxScrollY = 0;

        const THEME = {
            bgDark: '#0a0d12',
            bgLight: '#0e1219',
            card: '#131720',
            cardHover: '#171c26',
            border: '#232a35',
            borderHover: '#3a4453',
            text: '#eef1f5',
            textMuted: '#7a8494',
            accent: '#c9a962',
            accentSoft: 'rgba(201, 169, 98, 0.12)',
            red: '#b8463c',
            green: '#4c9a6a',
            pitch: '#12351f',
            font: "'Inter', sans-serif",
            fontDisplay: "'Barlow Condensed', sans-serif"
        };

        function drawRect(x, y, w, h, color, r = 0) {
            ctx.fillStyle = color;
            ctx.beginPath();
            if (r > 0 && ctx.roundRect) ctx.roundRect(x, y, w, h, r);
            else ctx.rect(x, y, w, h);
            ctx.fill();
        }

        function strokeRect(x, y, w, h, color, lw = 1, r = 0) {
            ctx.strokeStyle = color;
            ctx.lineWidth = lw;
            ctx.beginPath();
            if (r > 0 && ctx.roundRect) ctx.roundRect(x, y, w, h, r);
            else ctx.rect(x, y, w, h);
            ctx.stroke();
        }

        function drawText(text, x, y, color, size, align = 'left', weight = '500', font = THEME.font) {
            ctx.fillStyle = color;
            ctx.font = `${weight} ${size}px ${font}`;
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y);
        }

        // Esquinas tipo "HUD" para darle un acabado más premium a los paneles clave
        function drawCornerBrackets(x, y, w, h, color, len = 14) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
            ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
            ctx.moveTo(x, y + h - len); ctx.lineTo(x, y + h); ctx.lineTo(x + len, y + h);
            ctx.moveTo(x + w - len, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - len);
            ctx.stroke();
        }

        function drawBadge(team, x, y, r) {
            if (!team) {
                drawRect(x - r, y - r, r * 2, r * 2, '#2a2f38', 3);
                return;
            }
            if (team.logoImg && team.logoImg.complete && team.logoImg.naturalWidth > 0) {
                let img = team.logoImg;
                ctx.save();
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(x - r, y - r, r * 2, r * 2, 4);
                else ctx.rect(x - r, y - r, r * 2, r * 2);
                ctx.clip();
                drawRect(x - r, y - r, r * 2, r * 2, '#f4f5f7', 0);
                let pad = r * 2 * 0.14;
                let boxW = r * 2 - pad, boxH = r * 2 - pad;
                let scale = Math.min(boxW / img.naturalWidth, boxH / img.naturalHeight);
                scale *= (team.badgeScale || 1);
                let dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
                let dx = x - dw / 2, dy = y - dh / 2;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, dx, dy, dw, dh);
                ctx.restore();
                strokeRect(x - r, y - r, r * 2, r * 2, 'rgba(255,255,255,0.14)', 1, 4);
                return;
            }
            let grd = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
            grd.addColorStop(0, team.c1);
            grd.addColorStop(1, team.c2);
            ctx.fillStyle = grd;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x - r, y - r, r * 2, r * 2, 3);
            else ctx.rect(x - r, y - r, r * 2, r * 2);
            ctx.fill();
            strokeRect(x - r, y - r, r * 2, r * 2, 'rgba(255,255,255,0.12)', 1, 3);
            drawText(team.name.charAt(0), x, y + 1, '#fff', r * 1.05, 'center', '700', THEME.fontDisplay);
        }

        function generateSchedule() {
            let pool = TEAMS.map(t => t.id);
            let numTeams = pool.length;
            for (let round = 0; round < TOTAL_ROUNDS; round++) {
                let matches = [];
                for (let i = 0; i < numTeams / 2; i++) {
                    let home = pool[i];
                    let away = pool[numTeams - 1 - i];
                    matches.push({ home: home, away: away, hScore: '', aScore: '' });
                }
                tournamentData.push(matches);
                pool.splice(1, 0, pool.pop());
            }
        }

        function calculateStats() {
            teamStats = TEAMS.map(t => ({ ...t, pts: 0, pld: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0 }));
            tournamentData.forEach(round => {
                round.forEach(m => {
                    if (m.hScore !== '' && m.aScore !== '') {
                        let h = teamStats.find(t => t.id === m.home);
                        let a = teamStats.find(t => t.id === m.away);
                        let hG = parseInt(m.hScore), aG = parseInt(m.aScore);
                        h.pld++; a.pld++; h.gf += hG; h.ga += aG; a.gf += aG; a.ga += hG;
                        if (hG > aG) { h.pts += 3; h.w++; a.l++; }
                        else if (hG < aG) { a.pts += 3; a.w++; h.l++; }
                        else { h.pts += 1; a.pts += 1; h.d++; a.d++; }
                    }
                });
            });
            teamStats.forEach(t => t.gd = t.gf - t.ga);
            teamStats.sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : b.gd !== a.gd ? b.gd - a.gd : b.gf !== a.gf ? b.gf - a.gf : a.name.localeCompare(b.name));
            teamStats.forEach((t, i) => t.rank = i + 1);
            computeAwards();
        }

        const XI_SLOTS = [
            { label: 'Lateral Derecho', cat: 'Defensores', pos: 'LD' },
            { label: 'Central', cat: 'Defensores', pos: 'DC' },
            { label: 'Central', cat: 'Defensores', pos: 'DC' },
            { label: 'Lateral Izquierdo', cat: 'Defensores', pos: 'LI' },
            { label: 'Mediocampista de Contención', cat: 'Mediocampistas', pos: 'MCD' },
            { label: 'Mediocampista', cat: 'Mediocampistas', pos: 'MC' },
            { label: 'Mediocampista Ofensivo', cat: 'Mediocampistas', pos: 'MCO' },
            { label: 'Extremo Derecho', cat: 'Delanteros', pos: 'ED' },
            { label: 'Delantero Centro', cat: 'Delanteros', pos: 'DC' },
            { label: 'Extremo Izquierdo', cat: 'Delanteros', pos: 'EI' }
        ];

        function computeAwards() {
            let played = teamStats.filter(t => t.pld > 0 && t.rosterKey);
            if (played.length === 0) { awards = { scorers: [], assists: [], keepers: [], xi: null }; return; }
            let usedKeys = new Set();

            let scorers = [];
            played.forEach(t => {
                distributeWeighted(t, t.gf, 'goals').forEach(x => {
                    scorers.push({ player: x.player, role: x.role, team: t, g: x.val, cat: x.cat });
                });
            });
            scorers.sort((a, b) => b.g - a.g || a.player.localeCompare(b.player));

            let assists = [];
            played.forEach(t => {
                let totalAsist = Math.round(t.gf * 0.72);
                distributeWeighted(t, totalAsist, 'assists').forEach(x => {
                    assists.push({ player: x.player, role: x.role, team: t, a: x.val, cat: x.cat });
                });
            });
            assists.sort((a, b) => b.a - a.a || a.player.localeCompare(b.player));

            let keepers = played.map(t => {
                let p = pickPlayer(t, 'Arqueros', null, new Set());
                return { player: p ? p.name : 'Portero', team: t, ga: t.ga, pld: t.pld };
            }).sort((a, b) => (a.ga / a.pld) - (b.ga / b.pld));

            let pool = [...played].sort((a, b) => (b.pts + b.gd) - (a.pts + a.gd));
            let xiUsed = new Set();
            let idx = 0;
            function nextFor(cat, pos) {
                for (let tries = 0; tries < pool.length; tries++) {
                    let team = pool[idx % pool.length];
                    idx++;
                    let p = pickPlayer(team, cat, pos, xiUsed);
                    if (p) return { role: pos, label: pos, team, player: p.name, dorsal: p.dorsal };
                }
                return null;
            }
            let gkTeam = pool[0];
            let gkPlayer = pickPlayer(gkTeam, 'Arqueros', null, xiUsed);
            let xi = {
                gk: { label: 'Portero', team: gkTeam, player: gkPlayer ? gkPlayer.name : 'Portero', dorsal: gkPlayer ? gkPlayer.dorsal : null },
                def: [], mid: [], fwd: []
            };
            XI_SLOTS.forEach(slot => {
                let pick = nextFor(slot.cat, slot.pos);
                if (!pick) return;
                pick.label = slot.label;
                if (slot.cat === 'Defensores') xi.def.push(pick);
                else if (slot.cat === 'Mediocampistas') xi.mid.push(pick);
                else xi.fwd.push(pick);
            });

            awards = { scorers, assists, keepers, xi };
        }

        function calculateWinner(match, isFinal) {
            if (!match || match.ida1 === '' || match.ida2 === '' || match.vue1 === '' || match.vue2 === '') return null;
            let a1 = parseInt(match.ida1) + parseInt(match.vue1);
            let a2 = parseInt(match.ida2) + parseInt(match.vue2);
            if (a1 > a2) return match.t1;
            if (a2 > a1) return match.t2;
            if (!isFinal) return match.t1.rank < match.t2.rank ? match.t1 : match.t2;
            if (match.pen1 !== '' && match.pen2 !== '' && match.pen1 !== match.pen2) return parseInt(match.pen1) > parseInt(match.pen2) ? match.t1 : match.t2;
            return 'PENALTIES';
        }

        function checkLiguillaProgress() {
            let qW = liguilla.cuartos.map(m => m.winner);
            if (qW.every(w => w !== null && w !== 'PENALTIES')) {
                qW.sort((a, b) => a.rank - b.rank);
                if (liguilla.semis.length === 0 || liguilla.semis[0].t1.id !== qW[0].id) {
                    liguilla.semis = [
                        { id: 's1', t1: qW[0], t2: qW[3], ida1: '', ida2: '', vue1: '', vue2: '', winner: null },
                        { id: 's2', t1: qW[1], t2: qW[2], ida1: '', ida2: '', vue1: '', vue2: '', winner: null }
                    ];
                    liguilla.final = null;
                }
            } else { liguilla.semis = []; liguilla.final = null; }

            if (liguilla.semis.length === 2) {
                let sW = liguilla.semis.map(m => m.winner);
                if (sW.every(w => w !== null && w !== 'PENALTIES')) {
                    if (!liguilla.final || liguilla.final.t1.id !== sW[0].id) {
                        liguilla.final = { id: 'f1', t1: sW[0], t2: sW[1], ida1: '', ida2: '', vue1: '', vue2: '', pen1: '', pen2: '', winner: null };
                    }
                } else { liguilla.final = null; }
            }
        }

        // Simula con el motor completo (minuto a minuto) pero de forma instantánea, sin
        // mostrar la animación en vivo. El historial completo queda guardado igual que si
        // se hubiera visto en vivo, así que después se puede repasar jugada por jugada.
        function simulateMatchInstant(match, home, away, onFinish) {
            let s = buildSimState(home, away, onFinish);
            s.match = match;
            s.started = true; s.playing = true;
            addSimLog(s, 'kick', `Arranca el partido: ${home.name} vs ${away.name}.`);
            let guard = 0;
            while (!s.finished && guard < 500) { advanceSimMinute(s); guard++; }
        }

        function simulateRoundInstant() {
            let round = tournamentData[currentRound - 1];
            let pending = round.filter(m => m.hScore === '' || m.aScore === '');
            let toSim = pending;
            if (pending.length === 0) {
                if (!confirm(`La Jornada ${currentRound} ya tiene todos los resultados. ¿Volver a simularla completa desde cero?`)) return;
                toSim = round;
            } else if (!confirm(`Se van a simular ${pending.length} partido(s) de la Jornada ${currentRound} con minuto a minuto completo (de forma instantánea). ¿Continuar?`)) {
                return;
            }
            toSim.forEach(m => {
                let tH = TEAMS.find(t => t.id === m.home);
                let tA = TEAMS.find(t => t.id === m.away);
                simulateMatchInstant(m, tH, tA, (s, snap) => {
                    m.hScore = s.hGoals; m.aScore = s.aGoals; m._sim = snap;
                });
            });
            calculateStats();
            if (currentRound < TOTAL_ROUNDS) currentRound++;
        }

        function drawMatchupCard(m, x, y, w, phase) {
            let headerH = 26;
            let baseH = headerH + 96;
            let footerH = 36;
            let h = baseH + footerH;
            drawRect(x, y, w, h, THEME.card, 6);
            strokeRect(x, y, w, h, THEME.border, 1, 6);

            if (!m) return h;
            let isFinal = phase === 'final';
            let allFilled = m.ida1 !== '' && m.ida2 !== '' && m.vue1 !== '' && m.vue2 !== '';
            let aggTied = allFilled && (parseInt(m.ida1 || 0) + parseInt(m.vue1 || 0) === parseInt(m.ida2 || 0) + parseInt(m.vue2 || 0));

            // Encabezado de columnas: deja clarísimo que un número es la IDA y el otro la VUELTA
            strokeRect(x, y + headerH, w, 1, THEME.border);
            drawText('IDA', x + w - 75, y + headerH / 2, THEME.textMuted, 9, 'center', '700');
            drawText('VUELTA', x + w - 35, y + headerH / 2, THEME.textMuted, 9, 'center', '700');
            if (allFilled) {
                drawText('GLOBAL', x + 74, y + headerH / 2, THEME.accent, 9, 'left', '700');
            }

            let yOff = y + headerH;
            [m.t1, m.t2].forEach((team, i) => {
                let isWinner = m.winner === team;
                let bg = isWinner ? THEME.cardHover : 'transparent';
                drawRect(x, yOff, w, 48, bg, 0);
                if (isWinner) drawRect(x, yOff + 10, 3, 28, THEME.accent, 0);
                if (i === 0) strokeRect(x, yOff + 48, w, 1, THEME.border);

                if (team) {
                    drawText(team.rank, x + 24, yOff + 24, THEME.textMuted, 10, 'center', '600');
                    drawBadge(team, x + 49, yOff + 24, 11);
                    drawText(team.name.toUpperCase(), x + 69, yOff + 24, isWinner ? THEME.text : THEME.textMuted, 12, 'left', '600');

                    if (allFilled) {
                        let globalGoals = i === 0 ? (parseInt(m.ida1 || 0) + parseInt(m.vue1 || 0)) : (parseInt(m.ida2 || 0) + parseInt(m.vue2 || 0));
                        drawText(String(globalGoals), x + w - 116, yOff + 24, isWinner ? THEME.accent : THEME.textMuted, 14, 'center', '700');

        function openScoreInput(screenBox, obj, field, callback) {
            scoreInputEl.style.display = 'block';

            scoreInputEl.select();

            const commit = () => {
                let v = scoreInputEl.value.replace(/[^0-9]/g, '');
                obj[field] = v === '' ? '' : Math.min(99, parseInt(v));
                scoreInputEl.style.display = 'none';
                scoreInputEl.oninput = null;
                scoreInputEl.onblur = null;
                scoreInputEl.onkeydown = null;
                if (callback) callback();
            };

            scoreInputEl.oninput = () => {
                scoreInputEl.value = scoreInputEl.value.replace(/[^0-9]/g, '').slice(0, 2);
            };
            scoreInputEl.onkeydown = (e) => {
                if (e.key === 'Enter') { commit(); }
                if (e.key === 'Escape') { scoreInputEl.style.display = 'none'; scoreInputEl.onblur = null; }

            scoreInputEl.onblur = commit;

        function generateLiguilla() {
            const top8 = teamStats.slice(0, 8);
            if (top8.length < 8) return;
            liguilla.cuartos = [
                { id: 'c1', t1: top8[0], t2: top8[7], ida1: '', ida2: '', vue1: '', vue2: '', winner: null },
                { id: 'c2', t1: top8[3], t2: top8[4], ida1: '', ida2: '', vue1: '', vue2: '', winner: null },
                { id: 'c3', t1: top8[1], t2: top8[6], ida1: '', ida2: '', vue1: '', vue2: '', winner: null },
                { id: 'c4', t1: top8[2], t2: top8[5], ida1: '', ida2: '', vue1: '', vue2: '', winner: null }
            ];
            liguilla.semis = []; liguilla.final = null;
        }

        // Peso de "importancia" de un jugador: combina su dorsal (los números típicos de
        // primer equipo, 1–35 aprox., pesan mucho más que los de filial/reserva, 90+, 100+)
        // con su posición dentro de la lista de la plantilla, ya que en estos roles los
        // jugadores más relevantes de cada equipo suelen figurar primero. No es un dato
        // oficial de alineación confirmada (eso cambia partido a partido en la vida real),
        // pero evita que el protagonismo caiga siempre en gente de banca/filial.
        function playerImportance(p, idx) {
            // Si tenemos el dato real de si es titular confirmado (de la alineación
            // probable), eso manda con muchísimo peso. Si no tenemos el dato (jugador
            // fuera del reporte de alineaciones), se usa la heurística de dorsal/orden
            // como respaldo, igual que antes.
            if (p.titular === true) return 6.0;
            if (p.titular === false) return 0.12;

            let d = p.dorsal;
            let dorsalW;
            if (d === null || d === undefined) dorsalW = 0.6;
            else if (d <= 35) dorsalW = 1.0;
            else if (d <= 99) dorsalW = 0.22;
            else dorsalW = 0.08;
            let orderW = idx === undefined ? 1 : 1 / (1 + idx * 0.16);
            return dorsalW * orderW;
        }

        function pickWeighted(arr, weightFn, excludeNames) {
            if (!arr || arr.length === 0) return null;
            let total = 0;
            let weights = arr.map((p, i) => {
                let w = (excludeNames && excludeNames.has(p.name)) ? 0 : weightFn(p, i);
                total += w;
                return w;
            });
            if (total <= 0) {
                // Si excluir dejó todo en 0 (plantilla muy corta), igual respetamos la exclusión
                let remaining = excludeNames ? arr.filter(p => !excludeNames.has(p.name)) : arr;
                return remaining.length ? remaining[0] : arr[0];
            }
            let r = Math.random() * total;
            for (let i = 0; i < arr.length; i++) {
                r -= weights[i];
                if (r <= 0) return arr[i];
            }
            return arr[arr.length - 1];
        }

        // Jugador ponderado por importancia (prioriza titulares, no jugadores al azar).
        // `exclude` es opcional: un Set de nombres que no deben salir elegidos (por ejemplo,
        // para que el asistente de un gol nunca sea el mismo que anotó).
        function randPlayer(team, category, exclude) {
            if (!team.rosterKey || !ligaMX[team.rosterKey]) return { name: 'Jugador' };
            let arr = ligaMX[team.rosterKey][category];
            if (!arr || arr.length === 0) return { name: 'Jugador' };
            return pickWeighted(arr, playerImportance, exclude) || arr[0];
        }

        // Fuerza de ataque/defensa de un equipo: si ya jugó partidos en el torneo se usa
        // su rendimiento real (goles a favor/en contra por partido); si no, una base
        // pareja con una variación leve y determinista por equipo (para que no sea plano).
        // Ranking oficial de clubes (puntos actuales) — a mayor puntaje, mejor nivel del equipo.
        const RANKING_POINTS = {
            'Toluca': 1280, 'Tigres': 1273, 'Cruz Azul': 1261, 'América': 1225,
            'Chivas': 1221, 'Pachuca': 1214, 'Pumas': 1205, 'Monterrey': 1195,
            'Tijuana': 1181, 'FC Juárez': 1173, 'León': 1169, 'Necaxa': 1168,
            'Atlas': 1164, 'San Luis': 1158, 'Querétaro': 1157, 'Atlante': 1149,
            'Puebla': 1126, 'Santos': 1121
        };
        const RANK_MIN = Math.min(...Object.values(RANKING_POINTS));
        const RANK_MAX = Math.max(...Object.values(RANKING_POINTS));

        function teamRating(team, mode) {
            let pts = RANKING_POINTS[team.name] || (RANK_MIN + RANK_MAX) / 2;
            let power = (pts - RANK_MIN) / (RANK_MAX - RANK_MIN); // 0 (más flojo) .. 1 (más fuerte)
            let atkBase = 0.75 + power * 1.35;   // rango amplio: el ranking sí se nota
            let defBase = 2.10 - power * 1.35;   // los equipos fuertes conceden bastante menos
            let base = mode === 'atk' ? atkBase : defBase;

            let stat = teamStats.find(t => t.id === team.id);
            if (stat && stat.pld > 0) {
                // El rendimiento real del torneo pesa más, pero el ranking sigue influyendo
                if (mode === 'atk') return (stat.gf / stat.pld) * 0.55 + base * 0.45;
                return (stat.ga / stat.pld) * 0.55 + base * 0.45;
            }
            return base;
        }

        function displayMinute(s) {
            let h1 = 45 + s.stoppage1;
            if (s.minute <= 45) return String(s.minute);
            if (s.minute <= h1) return `45+${s.minute - 45}`;
            let m2 = s.minute - h1;
            if (m2 <= 45) return String(45 + m2);
            return `90+${m2 - 45}`;
        }

        function addSimLog(s, iconType, text) {
            s.log.push({ minute: displayMinute(s), icon: iconType, text });
        }

        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        const FOUL_TXT = [
            (t, p) => `${t.name}: falta de ${p.name}.`,
            (t, p) => `${t.name}: ${p.name} corta el avance rival con una falta.`,
            (t, p) => `${t.name}: infracción de ${p.name} en mitad de cancha.`,
            (t, p) => `${t.name}: ${p.name} llega tarde a la disputa y comete falta.`
        ];
        const YELLOW_TXT = [
            (t, p) => `${t.name}: tarjeta amarilla para ${p.name} por falta dura.`,
            (t, p) => `${t.name}: el árbitro amonesta a ${p.name}.`,
            (t, p) => `${t.name}: ${p.name} ve la amarilla por protestar.`,
            (t, p) => `${t.name}: falta táctica de ${p.name}, tarjeta amarilla.`
        ];
        const SECOND_YELLOW_TXT = [
            (t, p) => `${t.name}: ¡Doble amarilla! ${p.name} ve la segunda tarjeta y es expulsado.`,
            (t, p) => `${t.name}: expulsión de ${p.name} tras acumular dos amarillas.`
        ];
        const RED_TXT = [
            (t, p) => `${t.name}: ¡Expulsión! Tarjeta roja directa para ${p.name}.`,
            (t, p) => `${t.name}: ${p.name} es expulsado tras una entrada muy fuerte.`,
            (t, p) => `${t.name}: roja directa para ${p.name} por una falta violenta.`
        ];
        const CORNER_TXT = [
            (t) => `${t.name}: saque de esquina.`,
            (t) => `${t.name}: gana un córner tras un buen centro.`,
            (t) => `${t.name}: córner para el equipo tras un tiro bloqueado.`
        ];
        const SAVE_TXT = [
            (t, sh, gk, r) => `${t.name}: remate de ${sh.name}. El portero ${gk.name} (${r.short}) responde con una gran atajada.`,
            (t, sh, gk, r) => `${t.name}: ${sh.name} prueba desde media distancia, pero ${gk.name} controla sin problemas.`,
            (t, sh, gk, r) => `${t.name}: disparo de ${sh.name}. ${gk.name} despeja a córner.`,
            (t, sh, gk, r) => `${t.name}: gran atajada de ${gk.name} para evitar el gol de ${sh.name}.`
        ];
        const SHOTOFF_TXT = [
            (t, sh) => `${t.name}: ${sh.name} dispara, pero el balón se va desviado.`,
            (t, sh) => `${t.name}: remate de ${sh.name} que se pierde por encima del travesaño.`,
            (t, sh) => `${t.name}: ${sh.name} no logra conectar bien y el balón sale por la línea de fondo.`,
            (t, sh) => `${t.name}: ${sh.name} se precipita y el disparo termina en las gradas.`
        ];
        const GOAL_TEXT = {
            normal: (t, sh, as) => pick([
                `¡GOL! ${t.name}: ${sh.name} anota tras excelente pase de ${as.name}.`,
                `¡GOL! ${sh.name} define con categoría, gran asistencia de ${as.name}. ${t.name} celebra.`,
                `¡GOL de ${t.name}! ${sh.name} no perdona dentro del área tras habilitación de ${as.name}.`
            ]),
            cabezazo: (t, sh, as) => pick([
                `¡GOL! ${t.name}: ${as.name} centra al área y ${sh.name} conecta de cabeza para el gol.`,
                `¡GOL de cabeza! ${t.name}: ${sh.name} se eleva por encima de la defensa y remata el centro de ${as.name}.`
            ]),
            palomita: (t, sh, as) => pick([
                `¡GOLAZO! ${t.name}: ${sh.name} se lanza en palomita para rematar el centro de ${as.name}.`
            ]),
            larga: (t, sh) => pick([
                `¡GOLAZO! ${t.name}: ${sh.name} saca un remate impresionante desde fuera del área.`,
                `¡GOLAZO! ${sh.name} prueba desde lejos y el balón se clava en el ángulo. ${t.name} festeja.`
            ]),
            campanita: (t, sh, as) => pick([
                `¡GOLAZO! ${t.name}: ${sh.name} define con una vaselina espectacular tras pase de ${as.name}. ¡Categoría pura!`,
                `¡GOLAZO! ${sh.name} sorprende al portero con una campanita perfecta, asistencia de ${as.name}.`
            ]),
            chilena: (t, sh, as) => pick([
                `¡GOLAZO HISTÓRICO! ${t.name}: ¡${sh.name} conecta una CHILENA espectacular tras centro de ${as.name}! Una jugada para el recuerdo.`,
                `¡INCREÍBLE! ${sh.name} se acomoda y define de CHILENA. ${t.name} no lo puede creer, obra de arte tras el centro de ${as.name}.`
            ]),
            penal: (t, sh) => pick([
                `¡GOL DE PENAL! ${t.name}: ${sh.name} no falla desde los once pasos.`,
                `¡GOL! ${sh.name} engaña al portero y anota el penal para ${t.name}.`
            ])
        };

        // Entre más espectacular el tipo de gol, mucho menos probable (la chilena es rarísima)
        function rollGoalType() {
            let r = Math.random();
            if (r < 0.0006) return 'chilena';    // ~1 cada ~1,700 goles: casi imposible
            if (r < 0.004) return 'campanita';   // muy poco común
            if (r < 0.02) return 'palomita';
            if (r < 0.13) return 'cabezazo';
            if (r < 0.20) return 'larga';
            if (r < 0.27) return 'penal';
            return 'normal';
        }
        const CHANCE_TXT = [
            (t, p) => `${t.name}: ${p.name} arma una jugada de peligro en el área rival.`,
            (t, p) => `${t.name}: buena combinación ofensiva liderada por ${p.name}.`,
            (t, p) => `${t.name}: ${p.name} filtra un pase peligroso al área.`,
            (t, p) => `${t.name}: ${p.name} encara a dos rivales y genera peligro.`
        ];
        const OFFSIDE_TXT = [
            (t, p) => `${t.name}: ${p.name} se anticipa, pero el linier levanta la bandera. Fuera de lugar.`,
            (t, p) => `${t.name}: gol anulado, ${p.name} estaba en posición adelantada.`,
            (t, p) => `${t.name}: ${p.name} se escapa al espacio, pero es cazado en fuera de lugar.`
        ];
        const SUB_TXT = [
            (t, i, o) => `${t.name}: cambio, entra ${i.name} en lugar de ${o.name}.`,
            (t, i, o) => `${t.name}: doble función táctica, ${i.name} releva a ${o.name}.`,
            (t, i, o) => `${t.name}: el técnico mueve el banco, ${i.name} por ${o.name}.`
        ];

        function buildSimState(home, away, onFinish) {
            return {
                home, away,
                minute: 0,
                half: 1,
                hGoals: 0, aGoals: 0,
                log: [],
                playing: false,
                finished: false,
                started: false,
                speed: 1,
                stoppage1: 1 + Math.floor(Math.random() * 4),
                stoppage2: 2 + Math.floor(Math.random() * 5),
                accumMs: 0,
                subsDone: { h: 0, a: 0 },
                cardsHome: {}, cardsAway: {},
                sentOffHome: 0, sentOffAway: 0,
                followBottom: true,
                onFinish
            };
        }

        function loadFinishedSimState(home, away, snap, hVal, aVal) {
            if (snap) {
                return {
                    home, away,
                    minute: snap.minute, half: snap.half,
                    hGoals: snap.hGoals, aGoals: snap.aGoals,
                    log: snap.log.slice(),
                    playing: false, finished: true, started: true, speed: 1,
                    stoppage1: snap.stoppage1, stoppage2: snap.stoppage2,
                    accumMs: 0, subsDone: { ...snap.subsDone },
                    cardsHome: { ...snap.cardsHome }, cardsAway: { ...snap.cardsAway },
                    sentOffHome: snap.sentOffHome, sentOffAway: snap.sentOffAway,
                    followBottom: false,
                    onFinish: null
                };
            }
            return {
                home, away,
                minute: 0, half: 2, hGoals: hVal, aGoals: aVal,
                log: [{ minute: 'FIN', icon: 'full', text: `Resultado: ${home.name} ${hVal} - ${aVal} ${away.name}. (Sin minuto a minuto: fue capturado manualmente o con simulación rápida.)` }],
                playing: false, finished: true, started: true, speed: 1,
                stoppage1: 0, stoppage2: 0, accumMs: 0, subsDone: { h: 3, a: 3 },
                cardsHome: {}, cardsAway: {}, sentOffHome: 0, sentOffAway: 0,
                followBottom: false,
                onFinish: null
            };
        }

        function openSimulation(match, home, away, forceRestart) {
            if (!forceRestart && match.hScore !== '' && match.aScore !== '') {
                simState = loadFinishedSimState(home, away, match._sim, match.hScore, match.aScore);
                simState.match = match;
                simState.kind = 'match';
                simScrollY = 0;
                return;
            }
            simState = buildSimState(home, away, (s, snap) => {
                match.hScore = s.hGoals; match.aScore = s.aGoals; match._sim = snap;
                calculateStats();
            });
            simState.match = match;
            simState.kind = 'match';
            simScrollY = 0;
        }

        // Ida y vuelta de la liguilla: cada llave guarda su propio historial minuto a
        // minuto de forma independiente (_simIda / _simVuelta).
        function legFields(leg) { return leg === 'ida' ? { h: 'ida1', a: 'ida2' } : { h: 'vue2', a: 'vue1' }; }
        function legSimKey(leg) { return leg === 'ida' ? '_simIda' : '_simVuelta'; }

        function openLegSimulation(match, leg, isFinal, forceRestart) {
            let homeTeam = leg === 'ida' ? match.t1 : match.t2;
            let awayTeam = leg === 'ida' ? match.t2 : match.t1;
            let f = legFields(leg);
            let simKey = legSimKey(leg);
            let played = match[f.h] !== '' && match[f.a] !== '';

            if (!forceRestart && played) {
                simState = loadFinishedSimState(homeTeam, awayTeam, match[simKey], match[f.h], match[f.a]);
                simState.legMatch = match; simState.leg = leg; simState.isFinal = isFinal;
                simState.kind = 'leg';
                simScrollY = 0;
                return;
            }
            simState = buildSimState(homeTeam, awayTeam, (s, snap) => {
                match[f.h] = s.hGoals; match[f.a] = s.aGoals; match[simKey] = snap;
                match.winner = calculateWinner(match, isFinal);
                checkLiguillaProgress();
            });
            simState.legMatch = match; simState.leg = leg; simState.isFinal = isFinal;
            simState.kind = 'leg';
            simScrollY = 0;
        }

        function startSimulationNow() {
            if (!simState || simState.started) return;
            simState.started = true;
            simState.playing = true;
            addSimLog(simState, 'kick', `Arranca el partido: ${simState.home.name} vs ${simState.away.name}.`);
        }

        // Elige un sustituto que nunca puede ser el mismo jugador que sale: prueba varias
        // categorías por si el equipo tiene muy pocos jugadores en una posición.
        function pickSubstitute(team, excludeName) {
            let cats = ['Mediocampistas', 'Delanteros', 'Defensores'];
            for (let c of cats) {
                let arr = (team.rosterKey && ligaMX[team.rosterKey] && ligaMX[team.rosterKey][c]) || [];
                let candidates = arr.filter(p => p.name !== excludeName);
                if (candidates.length > 0) return pickWeighted(candidates, playerImportance) || candidates[0];
            }
            return { name: 'Jugador' };
        }

        function maybeSubstitution(s, side) {
            let team = side === 'h' ? s.home : s.away;
            if (s.subsDone[side] >= 3) return;
            let due = [58, 68, 78][s.subsDone[side]];
            if (s.minute !== due) return;
            if (Math.random() > 0.6) return;
            s.subsDone[side]++;
            let out = randPlayer(team, Math.random() < 0.5 ? 'Delanteros' : 'Mediocampistas');
            let inRoster = pickSubstitute(team, out.name);
            addSimLog(s, 'sub', pick(SUB_TXT)(team, inRoster, out));
        }

        function applyCard(s, isHome, team, p) {
            let cardMap = isHome ? s.cardsHome : s.cardsAway;
            let key = p.name;
            let r = Math.random();
            if (r < 0.01) {
                // roja directa, muy poco probable
                cardMap[key] = 2;
                if (isHome) s.sentOffHome++; else s.sentOffAway++;
                addSimLog(s, 'red', pick(RED_TXT)(team, p));
                return;
            }
            if (r < 0.20) {
                let already = cardMap[key] || 0;
                if (already >= 1) {
                    cardMap[key] = 2;
                    if (isHome) s.sentOffHome++; else s.sentOffAway++;
                    addSimLog(s, 'red', pick(SECOND_YELLOW_TXT)(team, p));
                } else {
                    cardMap[key] = 1;
                    addSimLog(s, 'yellow', pick(YELLOW_TXT)(team, p));
                }
                return;
            }
            addSimLog(s, 'foul', pick(FOUL_TXT)(team, p));
        }

        function generateMinuteEvent(s) {
            let atkH = teamRating(s.home, 'atk') * Math.max(0.55, 1 - s.sentOffHome * 0.18);
            let defH = teamRating(s.home, 'def') * (1 + s.sentOffHome * 0.16);
            let atkA = teamRating(s.away, 'atk') * Math.max(0.55, 1 - s.sentOffAway * 0.18);
            let defA = teamRating(s.away, 'def') * (1 + s.sentOffAway * 0.16);

            if (Math.random() > 0.30) return; // no todos los minutos tienen jugada

            let homeChance = (atkH * 1.12) / (atkH * 1.12 + atkA);
            let isHome = Math.random() < homeChance;
            let team = isHome ? s.home : s.away;
            let rival = isHome ? s.away : s.home;
            let myAtk = isHome ? atkH : atkA;
            let rivalDef = isHome ? defA : defH;

            let roll = Math.random();
            if (roll < 0.14) {
                let p = randPlayer(team, Math.random() < 0.7 ? 'Defensores' : 'Mediocampistas');
                applyCard(s, isHome, team, p);
            } else if (roll < 0.20) {
                addSimLog(s, 'corner', pick(CORNER_TXT)(team));
            } else if (roll < 0.86) {
                let shooter = randPlayer(team, Math.random() < 0.72 ? 'Delanteros' : 'Mediocampistas');

                if (Math.random() < 0.10) {
                    addSimLog(s, 'offside', pick(OFFSIDE_TXT)(team, shooter));
                    return;
                }

                let gkp = randPlayer(rival, 'Arqueros');
                let goalProb = Math.max(0.035, Math.min(0.34, 0.11 + (myAtk - rivalDef) * 0.14));
                let r2 = Math.random();
                if (r2 < goalProb) {
                    let assist = randPlayer(team, Math.random() < 0.5 ? 'Mediocampistas' : 'Delanteros', new Set([shooter.name]));
                    if (isHome) s.hGoals++; else s.aGoals++;
                    let gType = rollGoalType();
                    addSimLog(s, 'goal', GOAL_TEXT[gType](team, shooter, assist));
                } else if (r2 < goalProb + 0.45) {
                    addSimLog(s, 'save', pick(SAVE_TXT)(team, shooter, gkp, rival));
                } else {
                    addSimLog(s, 'shot', pick(SHOTOFF_TXT)(team, shooter));
                }
            } else {
                let p = randPlayer(team, 'Mediocampistas');
                addSimLog(s, 'chance', pick(CHANCE_TXT)(team, p));
            }
        }

        function advanceSimMinute(s) {
            s.minute++;
            let h1 = 45 + s.stoppage1;
            let total = h1 + 45 + s.stoppage2;

            if (s.half === 1 && s.minute === h1) {
                addSimLog(s, 'half', 'Final de la primera parte.');
                s.half = 2;
                s.playing = false; // pausa automática en el entretiempo
                return;
            }
            if (s.minute >= total) {
                s.minute = total;
                addSimLog(s, 'full', 'Final del partido.');
                s.finished = true;
                s.playing = false;
                let snapshot = {
                    minute: s.minute, half: s.half, hGoals: s.hGoals, aGoals: s.aGoals,
                    log: s.log.slice(), stoppage1: s.stoppage1, stoppage2: s.stoppage2,
                    subsDone: { ...s.subsDone }, cardsHome: { ...s.cardsHome }, cardsAway: { ...s.cardsAway },
                    sentOffHome: s.sentOffHome, sentOffAway: s.sentOffAway
                };
                if (typeof s.onFinish === 'function') s.onFinish(s, snapshot);
                return;
            }

            maybeSubstitution(s, 'h');
            maybeSubstitution(s, 'a');
            generateMinuteEvent(s);
        }

        function tickSimulation(dt) {
            if (!simState || !simState.playing || simState.finished) return;
            simState.accumMs += dt;
            let effectiveTick = 340 / simState.speed;
            let guard = 0;
            while (simState.accumMs >= effectiveTick && simState.playing && guard < 60) {
                simState.accumMs -= effectiveTick;
                advanceSimMinute(simState);
                guard++;
            }
        }

        const SIM_ICON_COLOR = {
            goal: () => THEME.accent,
            yellow: () => '#e0b53a',
            red: () => THEME.red,
            foul: () => THEME.textMuted,
            corner: () => THEME.textMuted,
            save: () => THEME.textMuted,
            shot: () => THEME.textMuted,
            chance: () => THEME.textMuted,
            offside: () => THEME.textMuted,
            sub: () => THEME.green,
            half: () => THEME.accent,
            full: () => THEME.accent,
            kick: () => THEME.accent
        };

        const SIM_ICON_GLYPH = {
            goal: '⚽',
            yellow: '🟨',
            red: '🟥',
            foul: '⚑',
            corner: '⌐',
            save: '🧤',
            shot: '↗',
            chance: '→',
            offside: '🚩',
            sub: '⇄',
            half: '⏸',
            full: '⏹',
            kick: '▶'
        };

        function renderSimOverlay() {
            let s = simState;
            drawRect(0, 0, vw, vh, THEME.bgDark);

            // En pantallas grandes el panel se centra en un ancho fijo para que no se
            // vea estirado; en móvil ocupa casi todo el ancho disponible.
            let outerPad = vw < 600 ? 12 : 24;
            let panelW = Math.min(vw - outerPad * 2, 640);
            let padX = (vw - panelW) / 2;
            let contentW = panelW;

            // Barra superior
            drawRect(0, 0, vw, 50, THEME.bgLight, 0);
            strokeRect(0, 49, vw, 1, THEME.border);
            let backHover = hoveredId === 'sim_back';
            drawText('←', outerPad, 25, backHover ? THEME.accent : THEME.text, 20, 'left', '700');
            addHitbox(0, 0, 70, 50, 'sim_back', () => { closeSimulation(); });
            let topLabel = `JORNADA ${String(currentRound).padStart(2, '0')}`;
            if (s.kind === 'leg') {
                let phaseLabel = s.isFinal ? 'FINAL' : (s.legMatch && liguilla.semis.includes(s.legMatch) ? 'SEMIFINAL' : 'CUARTOS DE FINAL');
                topLabel = `${phaseLabel} · ${s.leg === 'ida' ? 'PARTIDO DE IDA' : 'PARTIDO DE VUELTA'}`;
            }
            drawText(topLabel, vw / 2, 25, THEME.textMuted, 11, 'center', '700');

            let y = 68;
            let headerLabel = s.finished ? 'Final del partido' : (!s.started ? 'Antes del partido' : (s.half === 1 ? 'Primer tiempo' : 'Segundo tiempo'));
            drawText(!s.started && !s.finished ? headerLabel : `${headerLabel}: ${displayMinute(s)}'`, vw / 2, y, THEME.accent, 15, 'center', '700');
            y += 26;

            // Selector de velocidad (solo con el partido ya arrancado)
            if (s.started && !s.finished) {
                let speeds = [1, 2, 3, 4, 5];
                let spW = 34, spGap = 6;
                let totalW = speeds.length * spW + (speeds.length - 1) * spGap;
                let spX = vw / 2 - totalW / 2;
                speeds.forEach(sp => {
                    let isActive = s.speed === sp;
                    let hoverId = `speed_${sp}`;
                    let isHover = hoveredId === hoverId;
                    drawRect(spX, y, spW, 26, isActive ? THEME.accent : (isHover ? THEME.cardHover : THEME.card), 3);
                    strokeRect(spX, y, spW, 26, isActive ? THEME.accent : THEME.border, 1, 3);
                    drawText(`x${sp}`, spX + spW / 2, y + 13, isActive ? '#0a0d12' : THEME.textMuted, 11, 'center', '700');
                    addHitbox(spX, y, spW, 26, hoverId, () => { s.speed = sp; });
                    spX += spW + spGap;
                });
                y += 40;
            } else {
                y += 8;
            }

            // Marcador dentro de una tarjeta con franja de color de cada equipo
            let scoreCardH = 92;
            drawRect(padX, y, contentW, scoreCardH, THEME.card, 6);
            strokeRect(padX, y, contentW, scoreCardH, THEME.border, 1, 6);
            // (sin esquinas decorativas: se ven mejor limpias)
            drawRect(padX, y, 4, scoreCardH, s.home.c1, 0);
            drawRect(padX + contentW - 4, y, 4, scoreCardH, s.away.c1, 0);

            drawBadge(s.home, padX + 46, y + 34, 22);
            drawText(s.home.name.toUpperCase(), padX + 46, y + 68, THEME.text, 10.5, 'center', '600');
            drawBadge(s.away, padX + contentW - 46, y + 34, 22);
            drawText(s.away.name.toUpperCase(), padX + contentW - 46, y + 68, THEME.text, 10.5, 'center', '600');
            drawText(`${s.hGoals}`, vw / 2 - 24, y + 34, THEME.text, 32, 'center', '800', THEME.fontDisplay);
            drawText('-', vw / 2, y + 34, THEME.textMuted, 20, 'center', '600');
            drawText(`${s.aGoals}`, vw / 2 + 24, y + 34, THEME.text, 32, 'center', '800', THEME.fontDisplay);

            y += scoreCardH + 16;

            if (!s.started && !s.finished) {
                // Pantalla previa al partido: el usuario decide cuándo arranca
                let boxH = 120;
                drawRect(padX, y, contentW, boxH, THEME.card, 5);
                strokeRect(padX, y, contentW, boxH, THEME.border, 1, 5);
                drawText('El partido está listo para comenzar.', padX + contentW / 2, y + 30, THEME.textMuted, 12, 'center', '500');

                let btnW = 220, btnH2 = 46;
                let btnX = padX + contentW / 2 - btnW / 2;
                let btnY2 = y + 54;
                let hoverStart = hoveredId === 'sim_start';
                drawRect(btnX, btnY2, btnW, btnH2, hoverStart ? '#dab873' : THEME.accent, 4);
                drawText('▶  INICIAR PARTIDO', btnX + btnW / 2, btnY2 + btnH2 / 2, '#0a0d12', 13, 'center', '700');
                addHitbox(btnX, btnY2, btnW, btnH2, 'sim_start', () => { startSimulationNow(); });
                return;
            }

            // Log de eventos con scroll propio, con franja e ícono según el tipo de jugada
            let logTop = y;
            let logBottom = vh - 66;
            ctx.save();
            ctx.beginPath();
            ctx.rect(padX, logTop, contentW, logBottom - logTop);
            ctx.clip();

            let rowY = logTop + simScrollY;
            s.log.forEach(ev => {
                let rowH = 48;
                if (rowY + rowH > logTop - 60 && rowY < logBottom + 60) {
                    let iconColor = (SIM_ICON_COLOR[ev.icon] || (() => THEME.textMuted))();
                    let isGoal = ev.icon === 'goal';
                    let rh = rowH - 6;
                    drawRect(padX, rowY, contentW, rh, isGoal ? THEME.accentSoft : THEME.card, 4);
                    strokeRect(padX, rowY, contentW, rh, isGoal ? THEME.accent : THEME.border, isGoal ? 1.2 : 1, 4);
                    drawRect(padX, rowY, 3, rh, iconColor, 0);

                    // Columna de ícono: tamaño fijo, usa PNG de InGameIcons si está disponible
                    drawEventIcon(ev.icon, padX + 26, rowY + rh / 2, 18, iconColor);

                    // Columna de minuto: ancho fijo alineado a la derecha, nunca choca con el texto
                    drawText(`${ev.minute}'`, padX + 66, rowY + rh / 2, THEME.textMuted, 10, 'right', '700');

                    // Columna de descripción: siempre empieza en el mismo punto fijo
                    let textX = padX + 78;
                    ctx.save();
                    ctx.font = (isGoal ? "700 " : "500 ") + "12px 'Inter', sans-serif";
                    ctx.fillStyle = THEME.text;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    let maxTextW = contentW - (textX - padX) - 14;
                    let words = ev.text.split(' ');
                    let line = '';
                    let lines = [];
                    words.forEach(w => {
                        let test = line ? line + ' ' + w : w;
                        if (ctx.measureText(test).width > maxTextW && line) { lines.push(line); line = w; }
                        else line = test;
                    });
                    if (line) lines.push(line);
                    lines = lines.slice(0, 2);
                    let lineH = 15;
                    let startTy = rowY + rh / 2 - ((lines.length - 1) * lineH) / 2;
                    lines.forEach((ln, li) => ctx.fillText(ln, textX, startTy + li * lineH));
                    ctx.restore();
                }
                rowY += rowH;
            });
            let logContentH = rowY - (logTop + simScrollY);
            simMaxScrollY = Math.max(0, logContentH - (logBottom - logTop) + 20);
            if (s.followBottom) simScrollY = -simMaxScrollY;
            ctx.restore();

            if (!s.followBottom && !s.finished && simMaxScrollY > 4) {
                let fbW = 130, fbH = 30;
                let fbX = padX + contentW - fbW - 6;
                let fbY = logBottom - fbH - 6;
                let fbHover = hoveredId === 'sim_follow_bottom';
                drawRect(fbX, fbY, fbW, fbH, fbHover ? THEME.accent : THEME.card, 5);
                strokeRect(fbX, fbY, fbW, fbH, THEME.accent, 1, 5);
                drawText('▼ IR AL FINAL', fbX + fbW / 2, fbY + fbH / 2, fbHover ? '#0a0d12' : THEME.accent, 10, 'center', '700');
                addHitbox(fbX, fbY, fbW, fbH, 'sim_follow_bottom', () => { s.followBottom = true; });
            }

            // Botones inferiores
            let btnY = vh - 54;
            let btnH = 40;
            let btns = [
                { id: 'sim_restart', label: 'REINICIAR' },
                { id: 'sim_toggle', label: s.finished ? 'CERRAR' : (s.playing ? '⏸ PAUSAR' : '▶ CONTINUAR'), primary: !s.finished },
                { id: 'sim_back2', label: 'IR ATRÁS' }
            ];
            let bw = contentW / btns.length;
            btns.forEach((b, i) => {
                let bx = padX + i * bw;
                let hover = hoveredId === b.id;
                let bg = b.primary ? (hover ? '#dab873' : THEME.accent) : (hover ? THEME.cardHover : THEME.card);
                let fg = b.primary ? '#0a0d12' : (hover ? THEME.accent : THEME.text);
                drawRect(bx, btnY, bw - 4, btnH, bg, 4);
                if (!b.primary) strokeRect(bx, btnY, bw - 4, btnH, THEME.border, 1, 4);
                drawText(b.label, bx + (bw - 4) / 2, btnY + btnH / 2, fg, 10.5, 'center', '700');
                addHitbox(bx, btnY, bw - 4, btnH, b.id, () => {
                    if (b.id === 'sim_restart') {
                        if (s.kind === 'leg') openLegSimulation(s.legMatch, s.leg, s.isFinal, true);
                        else openSimulation(s.match, s.home, s.away, true);
                    }
                    else if (b.id === 'sim_toggle') {
                        if (s.finished) { closeSimulation(); }
                        else { s.playing = !s.playing; }
                    } else { closeSimulation(); }
                });
            });
        }

        function closeSimulation() {
            simState = null;
        }

        function render(time) {
            globalTime = time / 1000;
            let dt = lastFrameTime ? (time - lastFrameTime) : 16;
            lastFrameTime = time;
            hitboxes = [];

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (simState) {
                tickSimulation(dt);
                renderSimOverlay();
                requestAnimationFrame(render);
                return;
            }

            if (appState === 'intro') {
                renderIntro();
            } else {
                let headerH = renderHeader();

                ctx.save();
                ctx.beginPath();
                ctx.rect(0, headerH, vw, vh - headerH);
                ctx.clip();

                if (tabAnim) {
                    let elapsed = (time) - tabAnim.start;
                    let t = Math.max(0, Math.min(1, elapsed / tabAnim.duration));
                    let eased = 1 - Math.pow(1 - t, 3);
                    let realAddHitbox = addHitbox;
                    if (t < 1) addHitbox = function () {}; // evita hitboxes desalineados mientras se anima

                    let offOld = -tabAnim.dir * eased * vw;
                    let offNew = tabAnim.dir * (1 - eased) * vw;

                    ctx.save(); ctx.translate(offOld, 0);
                    renderTabByName(tabAnim.from, headerH);
                    ctx.restore();

                    ctx.save(); ctx.translate(offNew, 0);
                    renderTabByName(tabAnim.to, headerH);
                    ctx.restore();

                    addHitbox = realAddHitbox;
                    if (t >= 1) tabAnim = null;
                } else {
                    renderTabByName(currentTab, headerH);
                }

                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        function addHitbox(x, y, w, h, id, callback) {
            hitboxes.push({ x, y, w, h, id, callback });
        }

        function findHitbox(x, y) {
            for (let i = hitboxes.length - 1; i >= 0; i--) {
                let hb = hitboxes[i];
                if (x >= hb.x && x <= hb.x + hb.w && y >= hb.y && y <= hb.y + hb.h) return hb;
            }
            return null;
        }

        canvas.addEventListener('click', (e) => {
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            let hb = findHitbox(x, y);
            if (hb) {
                hb.callback({ x: rect.left + hb.x, y: rect.top + hb.y, w: hb.w, h: hb.h });
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            let hb = findHitbox(x, y);
            let newId = hb ? hb.id : null;
            if (newId !== hoveredId) {
                hoveredId = newId;
                canvas.style.cursor = hoveredId ? 'pointer' : 'default';
            }
        });

        canvas.addEventListener('mouseleave', () => {
            hoveredId = null;
            canvas.style.cursor = 'default';
        });

        canvas.addEventListener('wheel', (e) => {
            if (appState === 'intro') return;
            if (simState) {
                simState.followBottom = false;
                simScrollY -= e.deltaY;
                simScrollY = Math.min(0, Math.max(simScrollY, -simMaxScrollY));
                e.preventDefault();
                return;
            }
            if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
                scrollX -= e.deltaX;
                scrollX = Math.min(0, Math.max(scrollX, -maxScrollX));
            } else {
                scrollY -= e.deltaY;
                scrollY = Math.min(0, Math.max(scrollY, -maxScrollY));
            }
            e.preventDefault();
        }, { passive: false });

        let touchStartY = 0, touchStartX = 0;
        let initScrollY = 0, initScrollX = 0;
        canvas.addEventListener('touchstart', (e) => {
            if (appState === 'intro') return;
            touchStartY = e.touches[0].clientY;
            touchStartX = e.touches[0].clientX;
            initScrollY = simState ? simScrollY : scrollY;
            initScrollX = scrollX;
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (appState === 'intro') return;
            let dy = e.touches[0].clientY - touchStartY;
            let dx = e.touches[0].clientX - touchStartX;

            if (simState) {
                simState.followBottom = false;
                simScrollY = initScrollY + dy;
                simScrollY = Math.min(0, Math.max(simScrollY, -simMaxScrollY));
                return;
            }

            if (Math.abs(dx) > Math.abs(dy) * 1.5 && maxScrollX > 0) {
                scrollX = initScrollX + dx;
                scrollX = Math.min(0, Math.max(scrollX, -maxScrollX));
            } else {
                scrollY = initScrollY + dy;
                scrollY = Math.min(0, Math.max(scrollY, -maxScrollY));
            }
        }, { passive: true });

        function resize() {
            vw = window.innerWidth;
            vh = window.innerHeight;
            let dpr = window.devicePixelRatio || 1;
            canvas.width = vw * dpr;
            canvas.height = vh * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);

        window.onload = function () {
            resize();
            loadTeamAssets();
            loadEventIcons();
            loadLeagueLogo();
            generateSchedule();
            calculateStats();
            requestAnimationFrame(render);
        };
    </script>
</body>
